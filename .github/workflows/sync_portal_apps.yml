name: Auto Sync Pages to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'public/pages/*.html'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync HTML Pages with portal_apps Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          async function sync() {
            // تنظيف الرابط من أي مسافات أو أقواس أو سلاش زائدة
            let rawUrl = (process.env.SUPABASE_URL || "").trim();
            const urlMatch = rawUrl.match(/https?:\/\/[^\s\)\"\']+/);
            const supabaseUrl = urlMatch ? urlMatch[0].replace(/\/+$/, "") : "";
            const supabaseKey = (process.env.SUPABASE_KEY || "").trim();

            if (!supabaseUrl || !supabaseKey) {
              console.error("Error: SUPABASE_URL or SUPABASE_KEY is missing or invalid.");
              process.exit(1);
            }

            const pagesDir = path.join(process.cwd(), "public", "pages");
            if (!fs.existsSync(pagesDir)) {
              console.log("No pages directory found.");
              return;
            }

            const files = fs.readdirSync(pagesDir).filter(f => f.endsWith(".html"));
            
            for (const file of files) {
              const baseName = path.basename(file, ".html");
              const slug = baseName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
              const displayName = baseName.replace(/[_-]+/g, " ");

              const payload = {
                slug: slug,
                name: displayName,
                description: `Tool for ${displayName}`,
                url: file,
                kind: "static",
                allowed_roles: ["admin", "editor", "viewer"],
                is_active: true
              };

              console.log(`Syncing: ${file} -> slug: ${slug}`);

              const endpoint = `${supabaseUrl}/rest/v1/portal_apps?on_conflict=slug`;
              const res = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "apikey": supabaseKey,
                  "Authorization": `Bearer ${supabaseKey}`,
                  "Content-Type": "application/json",
                  "Prefer": "resolution=merge-duplicates"
                },
                body: JSON.stringify(payload)
              });

              if (!res.ok) {
                console.error(`Failed to sync ${file}:`, await res.text());
              } else {
                console.log(`Successfully synced ${file}`);
              }
            }
          }
          sync();
          '