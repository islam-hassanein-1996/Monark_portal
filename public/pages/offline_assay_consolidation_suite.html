<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabFusion Assay Suite - Advanced Mining Edition v4</title>

  <!-- React & ReactDOM (UMD build for standalone browsers) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel compiler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- html2canvas (export panel to PNG) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    body { background-color: #0f172a; color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- CSV Parsing Utility (BOM-safe) ---
    function parseCSV(text) {
      text = (text || "").replace(/^\uFEFF/, "");
      let lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') {
            i++;
          }
          lines.push(row);
          row = [""];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }
      return lines;
    }

    // --- Sample Issue & Misnumbering Registry (CSV-backed persistence) ---
    const REGISTRY_ISSUE_TYPES = [
      "Number skipped / Misnumbered",
      "Oil contamination (cannot analyze)",
      "Missing from data",
      "Name correction",
      "Other"
    ];

    const DEFAULT_REGISTRY_CSV = `Sample ID,Issue Type,Corrected ID,Notes,Status
CR238,Oil contamination (cannot analyze),,Oil spilled on sample; cannot be analyzed,Open
CR239,Oil contamination (cannot analyze),,Oil spilled on sample; cannot be analyzed,Open
SD43,Number skipped / Misnumbered,,,Open
SD1068,Number skipped / Misnumbered,,,Open`;

    // localStorage persistence so the registry survives refresh even when the
    // HTML is opened via file:// (where fetch() is blocked by the browser).
    const REGISTRY_STORAGE_KEY = "labfusion_sample_issue_registry_v4";

    const loadCachedRegistryCSV = () => {
      try {
        return localStorage.getItem(REGISTRY_STORAGE_KEY);
      } catch (e) { return null; }
    };
    const saveCachedRegistryCSV = (rawText) => {
      try {
        localStorage.setItem(REGISTRY_STORAGE_KEY, rawText);
        localStorage.setItem(REGISTRY_STORAGE_KEY + "_ts", String(Date.now()));
      } catch (e) { /* storage may be unavailable */ }
    };
    const clearCachedRegistryCSV = () => {
      try {
        localStorage.removeItem(REGISTRY_STORAGE_KEY);
        localStorage.removeItem(REGISTRY_STORAGE_KEY + "_ts");
      } catch (e) { /* ignore */ }
    };

    const parseRegistryCSV = (text) => {
      const rows = parseCSV(text);
      if (!rows.length) return [];
      const header = rows[0].map(h => h.trim());
      const colIndex = name => header.findIndex(h => h.toLowerCase() === name.toLowerCase());
      const iSample = colIndex("Sample ID");
      const iType = colIndex("Issue Type");
      const iCorrected = colIndex("Corrected ID");
      const iNotes = colIndex("Notes");
      const iStatus = colIndex("Status");
      const issues = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row.some(c => (c || "").trim() !== "")) continue;
        const sampleId = normalizeSampleId((row[iSample] || "").toString().trim());
        if (!sampleId) continue;
        issues.push({
          sampleId,
          issueType: (iType !== -1 ? (row[iType] || "").toString().trim() : "") || "Other",
          correctedId: (iCorrected !== -1 ? (row[iCorrected] || "").toString().trim() : "") || sampleId,
          notes: (iNotes !== -1 ? (row[iNotes] || "").toString().trim() : "") || "",
          status: (iStatus !== -1 ? (row[iStatus] || "").toString().trim() : "") || "Open"
        });
      }
      return issues;
    };

    const registryToCSVText = (issues) => {
      const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
      const lines = ["Sample ID,Issue Type,Corrected ID,Notes,Status"];
      issues.forEach(iss => {
        lines.push([
          esc(iss.sampleId),
          esc(iss.issueType || "Other"),
          esc(iss.correctedId && iss.correctedId !== iss.sampleId ? iss.correctedId : ""),
          esc(iss.notes || ""),
          esc(iss.status || "Open")
        ].join(","));
      });
      return lines.join("\r\n");
    };

    // --- Robust Lab Date Parsing (ISO YYYY-MM-DD AND US MM/DD/YYYY) ---
    const parseLabDateToTime = (dateString) => {
      if (!dateString) return new Date("9999-12-31").getTime();
      const cleanStr = dateString.toString().trim().split(" ")[0];
      if (!cleanStr || cleanStr === "9999-99-99" || cleanStr === "N/A" || cleanStr === "nan") {
        return new Date("9999-12-31").getTime();
      }

      // ISO: YYYY-MM-DD
      const isoMatch = cleanStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (isoMatch) {
        const t = new Date(+isoMatch[1], +isoMatch[2]-1, +isoMatch[3]).getTime();
        if (!isNaN(t)) return t;
      }

      // US: MM/DD/YYYY  (or DD/MM ambiguous -> treat as MM/DD/YYYY as source data shows)
      const slashMatch = cleanStr.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (slashMatch) {
        let [, a, b, y] = slashMatch;
        y = +y < 100 ? 2000 + +y : +y;
        const t = new Date(y, +a-1, +b).getTime();
        if (!isNaN(t)) return t;
      }

      const fallback = new Date(cleanStr).getTime();
      return isNaN(fallback) ? new Date("9999-12-31").getTime() : fallback;
    };

    const formatDateForDisplay = (dateString) => {
      const t = parseLabDateToTime(dateString);
      if (t === new Date("9999-12-31").getTime()) return dateString || "N/A";
      const d = new Date(t);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    };

    // --- Normalize Sample ID: strip spaces and leading zeros in numeric suffix ---
    // e.g. "00085" -> "85", "BS001" -> "BS1", "CR 264" -> "CR264"
    const normalizeSampleId = (rawId) => {
      const clean = (rawId || "").toString().replace(/\s+/g, "");
      return clean.replace(/([A-Za-z._]*)(\d+)$/, (m, p, n) => p + String(parseInt(n, 10)));
    };

    // --- Extract Prefix & Numeric Components ---
    const parseSampleComponents = (rawId) => {
      const clean = (rawId || "").toString().replace(/\s+/g, "");
      const match = clean.match(/^([A-Za-z\.\_]+)?(\d+)$/);
      if (match) {
        return {
          cleanId: clean,
          prefix: (match[1] || "").toUpperCase(),
          rawPrefix: match[1] || "",
          num: parseInt(match[2], 10),
          paddingWidth: match[2].length
        };
      }
      return { cleanId: clean, prefix: "", rawPrefix: "", num: null, paddingWidth: 4 };
    };

    // --- Dynamic Sample Grouping Logic ---
    const getSampleGroup = (sampleId, customProcessingPrefixes = ["V", "trench", "Soil", "S.T", "H"]) => {
      const { cleanId, prefix, num } = parseSampleComponents(sampleId);
      const idUpper = cleanId.toUpperCase();

      // Rule 1: Alluvial Materials group (OV prefix OR numeric range 8501-8600)
      if (idUpper.startsWith("OV") || (num !== null && prefix === "" && num >= 8501 && num <= 8600)) {
        return "Alluvial Materials group";
      }

      // Rule 2: Tailing group (Numeric range 8747-8782)
      if (num !== null && prefix === "" && num >= 8747 && num <= 8782) {
        return "tailing group";
      }

      // Rule 3: Crusher Samples (CR001 -> CRxxx)
      if (idUpper.startsWith("CR")) {
        return "Crusher Samples";
      }

      // Rule 4: Black Sand (BS001 -> BSxxx)
      if (idUpper.startsWith("BS")) {
        return "Black Sand Samples";
      }

      // Rule 5: Hisham Samples (HZ, NABG, NABF, HIGHQUALITY)
      if (idUpper.startsWith("NABG") || idUpper.startsWith("NABF") ||
          idUpper.startsWith("HZ") || idUpper.startsWith("HIGHQUALITY")) {
        return "Hisham Samples (HZ)";
      }

      // Rule 6: Grab Samples (Numeric 1 -> 9999 only).
      if (num !== null && prefix === "" && num >= 1 && num <= 9999) {
        return "grab Samples";
      }

      // Rule 7: Processing Plant Prefixes (V, trench, Soil, S.T, H, Pl, NAP, XRF, Red)
      if (customProcessingPrefixes.some(p => p.trim() && idUpper.startsWith(p.trim().toUpperCase()))) {
        return "Processing Plant group";
      }

      // Rule 8: Dump Samples (SD Prefix)
      if (idUpper.startsWith("SD")) {
        return "Dump Samples";
      }

      // Rule 9: TR Samples (10000 -> 99999)
      if (num !== null && prefix === "") {
        if (num >= 10000 && num <= 99999) return "TR Samples";
        if (num >= 100000) return "DD Samples";
      }

      return "other samples";
    };

    // --- Au Grade Colour Ranges (g/t) ---
    const GRADE_RANGES = [
      { id: 'lt_010', label: '< 0.10', rangeLabel: '< 0.10', color: '#94a3b8', min: -Infinity, max: 0.10 },
      { id: '010_030', label: '0.10 – 0.30', color: '#1f6fff', min: 0.10, max: 0.30 },
      { id: '030_050', label: '0.30 – 0.50', color: '#00e57a', min: 0.30, max: 0.50 },
      { id: '050_100', label: '0.50 – 1.00', color: '#ffd21e', min: 0.50, max: 1.00 },
      { id: '100_300', label: '1.00 – 3.00', color: '#f5222d', min: 1.00, max: 3.00 },
      { id: 'gte_300', label: '≥ 3.00', color: '#e838ff', min: 3.00, max: Infinity }
    ];

    const getGradeRange = (numericGrade) => {
      const v = Number(numericGrade);
      if (isNaN(v) || v < 0) return null;
      for (const r of GRADE_RANGES) {
        if (v >= r.min && v < r.max) return r;
      }
      return GRADE_RANGES[GRADE_RANGES.length - 1];
    };

    // Light text on dark colors, dark text on light colors (e.g. yellow)
    const gradeTextColor = (hex) => {
      const c = hex.replace('#', '');
      const r = parseInt(c.substr(0, 2), 16);
      const g = parseInt(c.substr(2, 2), 16);
      const b = parseInt(c.substr(4, 2), 16);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.6 ? '#0f172a' : '#ffffff';
    };

    const gradeRangeDistribution = (samples) => {
      const dist = GRADE_RANGES.map(r => ({ ...r, count: 0 }));
      samples.forEach(s => {
        const r = getGradeRange(s.numericGrade);
        if (r) {
          const entry = dist.find(d => d.id === r.id);
          if (entry) entry.count++;
        }
      });
      const total = dist.reduce((sum, d) => sum + d.count, 0);
      return dist.map(d => ({
        ...d,
        percentage: total > 0 ? ((d.count / total) * 100).toFixed(1) : "0.0"
      }));
    };

    // --- Export Analytics View to PNG (html2canvas with manual fallback) ---
    const downloadPng = (canvas, filename) => {
      const link = document.createElement("a");
      link.setAttribute("href", canvas.toDataURL("image/png"));
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    const drawDistributionRows = (ctx, dist, total, startY) => {
      const rowH = 46;
      dist.forEach((r, i) => {
        const y = startY + i * rowH;
        ctx.fillStyle = "#f1f5f9";
        ctx.font = "bold 14px monospace";
        ctx.fillText(r.label, 28, y + 18);

        const barX = 180;
        const barW = 600;
        const barH = 28;
        const frac = total > 0 ? r.count / total : 0;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(barX, y, barW, barH);
        ctx.fillStyle = r.color;
        ctx.fillRect(barX, y, Math.max(barW * frac, r.count > 0 ? 14 : 0), barH);

        ctx.fillStyle = r.count > 0 ? gradeTextColor(r.color) : "#0f172a";
        ctx.font = "bold 13px monospace";
        ctx.fillText(String(r.count), barX + Math.max(barW * frac, r.count > 0 ? 14 : 0) - 34, y + 20);

        ctx.fillStyle = "#f1f5f9";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText(String(r.count), 830, y + 20);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "12px sans-serif";
        ctx.fillText(`${r.percentage}%`, 880, y + 20);
      });
      return startY + dist.length * rowH;
    };

    const drawFullViewFallback = (stats, dist, total, groupName) => {
      const cardH = 110;
      const w = 940;
      const h = 70 + cardH + 30 + dist.length * 46 + 60;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "#f1f5f9";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText("LabFusion Mining Suite v4 - Analytics Overview", 28, 44);

      const cardDefs = [
        { label: "Reported Samples", value: String(stats.reportedSamplesCount), color: "#f1f5f9" },
        { label: "Dispatches Processed", value: String(stats.processedDispatches), color: "#2dd4bf" },
        { label: "Average Au Grade", value: String(stats.averageGrade), color: "#34d399" }
      ];
      const cardW = 260;
      const gap = 18;
      const cardY = 66;
      cardDefs.forEach((c, i) => {
        const x = 28 + i * (cardW + gap);
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.roundRect(x, cardY, cardW, cardH, 10);
        ctx.fill();
        ctx.fillStyle = "#64748b";
        ctx.font = "11px sans-serif";
        ctx.fillText(c.label.toUpperCase(), x + 16, cardY + 28);
        ctx.fillStyle = c.color;
        ctx.font = "bold 26px sans-serif";
        ctx.fillText(c.value, x + 16, cardY + 80);
      });

      const distY = cardY + cardH + 46;
      ctx.fillStyle = "#f1f5f9";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Au Grade Colour Distribution${groupName !== "all" ? ` - ${groupName}` : ""}`, 28, distY - 8);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "12px sans-serif";
      ctx.fillText(`Total samples: ${total}`, 28, distY + 12);

      const endY = drawDistributionRows(ctx, dist, total, distY + 30);

      ctx.fillStyle = "#64748b";
      ctx.font = "12px sans-serif";
      ctx.fillText(`Generated ${new Date().toLocaleString()}`, 28, endY + 34);

      return canvas;
    };

    // Remove emoji/symbol glyphs that html2canvas often fails to rasterize
    const stripEmojis = (root) => {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(n => {
        n.textContent = n.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, "");
      });
    };

    const exportViewImage = (opts) => {
      const node = document.getElementById(opts.nodeId);
      if (!node) {
        downloadPng(opts.fallback(), opts.filename);
        return;
      }

      // Clone the view so excluded elements (e.g. Logged Sample Issues card)
      // can be stripped without altering the live UI.
      const clone = node.cloneNode(true);
      if (opts.excludeIds) {
        opts.excludeIds.forEach(id => {
          const el = clone.querySelector("#" + id);
          if (el) el.remove();
        });
      }
      if (opts.beforeCapture) opts.beforeCapture(clone);
      stripEmojis(clone);
      clone.style.position = "fixed";
      clone.style.left = "-99999px";
      clone.style.top = "0";
      clone.style.zIndex = "-1";
      document.body.appendChild(clone);

      const cleanup = () => { document.body.removeChild(clone); };
      const render = () => {
        if (typeof html2canvas === "function") {
          html2canvas(clone, { backgroundColor: "#0f172a", scale: 2, useCORS: true })
            .then(canvas => { cleanup(); downloadPng(canvas, opts.filename); })
            .catch(() => { cleanup(); downloadPng(opts.fallback(), opts.filename); });
        } else {
          cleanup();
          downloadPng(opts.fallback(), opts.filename);
        }
      };

      // Give cloned content a moment to render fonts/layout before capture.
      setTimeout(render, 100);
    };

    const exportFullAnalyticsImage = (stats, dist, total, groupName) => {
      const safeGroup = groupName === "all" ? "All_Types" : groupName.replace(/\s+/g, "_");
      exportViewImage({
        nodeId: "analytics-view",
        excludeIds: ["stat-card-logged-issues"],
        filename: `LabFusion_Analytics_Overview_${safeGroup}_${new Date().toISOString().split('T')[0]}.png`,
        beforeCapture: (clone) => {
          const title = clone.querySelector("#distribution-title");
          if (title) {
            title.textContent = groupName !== "all"
              ? `Au Grade Colour Distribution - ${groupName}`
              : "Au Grade Colour Distribution";
            title.style.textTransform = "none";
            title.style.color = "#cbd5e1";
          }
        },
        fallback: () => drawFullViewFallback(stats, dist, total, groupName)
      });
    };

    // --- Prefix-Aware Sequence Gap Detection Engine ---
    const detectGapsInSequence = (samples, excludedPrefixes = []) => {
      const streamMap = {};

      samples.forEach(s => {
        if (s.isQaqc || s.isGapPlaceholder) return;

        // Processing Plant and Hisham groups are tracked for count/visibility only —
        // their prefixes are non-sequential identifiers, so never scan them for gaps.
        if (s.group === "Processing Plant group" || s.group === "Hisham Samples (HZ)") return;

        const comp = parseSampleComponents(s.sampleId);
        if (comp.num === null) return;

        if (excludedPrefixes.some(p => p.toUpperCase() === comp.prefix)) return;

        const streamKey = `${s.group}__${comp.prefix}`;
        if (!streamMap[streamKey]) {
          streamMap[streamKey] = {
            group: s.group,
            prefix: comp.prefix,
            rawPrefix: comp.rawPrefix,
            paddingWidth: comp.paddingWidth,
            items: []
          };
        }
        streamMap[streamKey].items.push({ num: comp.num, sampleId: comp.cleanId });
      });

      const gapRecords = [];
      const stats = {};

      Object.keys(streamMap).forEach(key => {
        const stream = streamMap[key];
        const items = stream.items;

        if (items.length < 2) return;

        items.sort((a, b) => a.num - b.num);
        const nums = items.map(x => x.num);
        const presentSet = new Set(nums);
        const minNum = nums[0];
        const maxNum = nums[nums.length - 1];

        const formatId = (val) => {
          const padded = String(val).padStart(stream.paddingWidth, '0');
          return stream.rawPrefix + padded;
        };

        const missingList = [];
        for (let num = minNum + 1; num < maxNum; num++) {
          if (!presentSet.has(num)) {
            missingList.push(num);
          }
        }

        const missingRanges = [];
        if (missingList.length > 0) {
          let rangeStart = missingList[0];
          let prevNum = rangeStart;

          for (let k = 1; k <= missingList.length; k++) {
            const currentNum = missingList[k];
            if (currentNum === prevNum + 1) {
              prevNum = currentNum;
            } else {
              missingRanges.push(rangeStart === prevNum ? formatId(rangeStart) : `${formatId(rangeStart)} - ${formatId(prevNum)}`);

              for (let fill = rangeStart; fill <= prevNum; fill++) {
                gapRecords.push({
                  sampleId: formatId(fill),
                  rawGrade: "GAP",
                  grade: "GAP / MISSING",
                  numericGrade: -1,
                  isBelowDetection: false,
                  isQaqc: false,
                  jobId: "GAP - NOT REPORTED",
                  dispatchNo: "N/A",
                  receivedDate: "MISSING",
                  reportDate: "MISSING",
                  fileName: "N/A",
                  group: stream.group,
                  isGapPlaceholder: true
                });
              }

              if (currentNum !== undefined) {
                rangeStart = currentNum;
                prevNum = currentNum;
              }
            }
          }
        }

        const displayLabel = `${stream.group} (${stream.prefix || 'Numeric'})`;
        stats[displayLabel] = {
          min: formatId(minNum),
          max: formatId(maxNum),
          expected: (maxNum - minNum) + 1,
          actual: items.length,
          missing: missingList.length,
          ranges: missingRanges
        };
      });

      return { gapRecords, stats };
    };

    // --- Main React App ---
    function App() {
      const [detectionStrategy, setDetectionStrategy] = useState("fixed_0.001");
      const [includeQAQC, setIncludeQAQC] = useState(false);
      const [insertGaps, setInsertGaps] = useState(true);
      const [activeTab, setActiveTab] = useState("analytics");

      const [processingPrefixesStr, setProcessingPrefixesStr] = useState("V, trench, Soil, S.T, H, T, Pl, XRF, Red, BlackSand");
      const [excludedGapPrefixesStr, setExcludedGapPrefixesStr] = useState("H");

      const [sampleIssues, setSampleIssues] = useState(() => {
        const cached = loadCachedRegistryCSV();
        return cached ? parseRegistryCSV(cached) : parseRegistryCSV(DEFAULT_REGISTRY_CSV);
      });
      const [registrySourceName, setRegistrySourceName] = useState(() => {
        const cached = loadCachedRegistryCSV();
        return cached ? "Sample_Issue_Registry.csv (cached locally)" : "Sample_Issue_Registry.csv (default embedded)";
      });

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            // cache: "no-store" + a cache-busting query guarantees a fresh copy
            // every page refresh, so user appends to Sample_Issue_Registry.csv
            // are picked up automatically (works when served via HTTP).
            const res = await fetch("Sample_Issue_Registry.csv?_=" + Date.now(), { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            if (cancelled) return;
            const issues = parseRegistryCSV(text);
            // Always replace when the file is reachable — even if the user has
            // emptied it (zero rows). This keeps the live registry synced to the CSV.
            setSampleIssues(issues);
            setRegistrySourceName(`Sample_Issue_Registry.csv (auto-loaded${issues.length === 0 ? " - empty" : `, ${issues.length} row(s)`})`);
            // Persist the raw text so a refresh over file:// still shows the latest.
            saveCachedRegistryCSV(text);
            console.log(`[Registry] Auto-loaded ${issues.length} row(s) from Sample_Issue_Registry.csv`);
          } catch (err) {
            if (cancelled) return;
            // Fallback 1: localStorage cache (used when opened via file://).
            const cached = loadCachedRegistryCSV();
            if (cached) {
              const issues = parseRegistryCSV(cached);
              const ts = localStorage.getItem(REGISTRY_STORAGE_KEY + "_ts");

          const rows = rawFilesData[fileName];
          let recDate = "9999-99-99";

          for (let i = 0; i < Math.min(rows.length, 25); i++) {
            const row = rows[i] || [];
            for (let j = 0; j < row.length; j++) {
              const cell = (row[j] || "").toString().trim().toUpperCase();
              if (cell.includes("JOB RECEIVED DATE:")) {
                recDate = (row[j+1] || row[j+2] || "").toString().trim() || recDate;
              }
              if (cell.includes("TEST REPORT")) {
                jobId = (row[j+1] || row[j+2] || "").toString().trim() || jobId;
              }
            }
          }
          jobs.push({ fileName, jobId, recDate });

        jobs.sort((a, b) => parseLabDateToTime(a.recDate) - parseLabDateToTime(b.recDate));

        let jobReceivedDate = "N/A";

        let jobId = "N/A";
        let headerRowIndex = -1;
        let targetColIndex = 6;

        for (let i = 0; i < Math.min(rows.length, 25); i++) {
          const row = rows[i];
          if (!row) continue;

          for (let j = 0; j < row.length; j++) {
            const cell = (row[j] || "").toString().trim();
            if (cell.toUpperCase().includes("JOB RECEIVED DATE:")) {
              jobReceivedDate = findNextNonEmpty(row, j) || "N/A";
            }
            if (cell.toUpperCase().includes("JOB REPORT DATE:")) {
              jobReportDate = findNextNonEmpty(row, j) || "N/A";
            }
            if (cell.toUpperCase().includes("TEST REPORT")) {
              jobId = findNextNonEmpty(row, j) || "N/A";
            }
          }

          if (row[0] && row[0].toString().replace(/\s+/g, "").toUpperCase() === "SAMPLEID") {
            headerRowIndex = i;
          }
        }

        if (jobId === "N/A" || !jobId) {
          const match = fileName.match(/RMF\d+/);
          jobId = match ? match[0] : fileName.replace("-MCFE.csv", "").replace(".csv", "");
        }

        const dispatchNo = dispatchMapping[fileName] || dispatchMapping[jobId] || "Dispatch-01";

        if (headerRowIndex !== -1) {
          for (let i = Math.max(0, headerRowIndex - 4); i <= headerRowIndex; i++) {
            const row = rows[i];
            if (!row) continue;
            for (let j = 0; j < row.length; j++) {
              const val = (row[j] || "").toString().trim();
              if (val.toUpperCase() === "FAS-211" || val.toUpperCase() === "AU" || val.toUpperCase() === "AU PPM") {
                targetColIndex = j;
              }
            }
          }
        } else {
          headerRowIndex = 15;

        const samplesList = [];

        for (let i = headerRowIndex + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          const rawSampleId = (row[0] || "").toString();
          const sampleId = normalizeSampleId(rawSampleId);

          const sampleType = (row[1] || "").toString().trim().toUpperCase();

            rawGrade: rawVal,

            isBelowDetection,
            isQaqc,
            jobId,

            receivedDate: jobReceivedDate,
            reportDate: jobReportDate,
            fileName,
            group: getSampleGroup(sampleId, parsedProcessingPrefixes),

import glob
import os

# --- CONSOLIDATION SETUP CONFIGURATION ---

def normalize_sample_id(sample_id):
    clean = str(sample_id).replace(" ", "")
    import re
    m = re.match(r"^([A-Za-z.\\_]*)(\\d+)$", clean)
    if m:
        return m.group(1) + str(int(m.group(2)))
    return clean


def parse_sample_components(sample_id):
    clean = normalize_sample_id(sample_id)
    import re
    m = re.match(r"^([A-Za-z.\\_]+)?(\\d+)$", clean)
    if m:

def get_sample_group(sample_id):

def extract_and_transform(file_path):

    job_received_date, job_report_date, job_id = "N/A", "N/A", "N/A"
    header_row_idx = 15

    for i in range(min(len(df_raw), 25)):
        row = df_raw.iloc[i].astype(str).tolist()
        for j, val in enumerate(row):
            v = val.strip().upper()
            if "JOB RECEIVED DATE:" in v:
                job_received_date = next((x for x in row[j+1:] if x not in ("nan", "").strip() and x.strip()), "N/A")
            if "JOB REPORT DATE:" in v:
                job_report_date = next((x for x in row[j+1:] if x.strip()), "N/A")
            if "TEST REPORT" in v:
                job_id = next((x for x in row[j+1:] if x.strip()), "N/A")
        if row[0].replace(" ", "").strip().upper() == "SAMPLEID":
            header_row_idx = i

    if not job_id or job_id == "N/A":
        job_id = os.path.basename(file_path).split("-")[0]

    target_assay_col = 6
    for col in range(df_raw.shape[1]):
        ctx = df_raw.iloc[max(0, header_row_idx-4):header_row_idx+1, col].astype(str).str.upper().tolist()
        if any("FAS-211" in c or "AU" in c for c in ctx):
            target_assay_col = col
            break

    df_data = df_raw.iloc[header_row_idx + 1:].copy()
    df_data = df_data.rename(columns={0: 'Sample ID', target_assay_col: 'Au_raw'})
    df_data = df_data.dropna(subset=['Sample ID'])

            df_data['Sample ID'].str.upper().str.contains("STD") |
            df_data['Sample ID'].str.upper().str.contains("BLANK") |
            df_data['Sample ID'].str.upper().str.contains("AMIS") |
            df_data['Sample ID'].str.upper().str.contains("G316")
        )
        df_data = df_data[~mask]

    def parse_val(v):
        s = str(v).strip()
        if s.startswith("<"):
            return BELOW_LIMIT_FIXED
        try:
            return float(s)
        except ValueError:
            return None

    df_data['FAS-211 Au ppm'] = df_data['Au_raw'].apply(parse_val)
    df_data['Job Received Date'] = job_received_date
    df_data['Job Report Date'] = job_report_date
    df_data['Job ID'] = job_id
    df_data['Sample Group'] = df_data['Sample ID'].apply(get_sample_group)
    return df_data[['Sample ID', 'FAS-211 Au ppm', 'Job Received Date', 'Job Report Date', 'Sample Group', 'Job ID']]


def detect_and_insert_sequence_gaps(df):
    groups = ["Alluvial Materials group", "Crusher Samples", "Black Sand Samples",
              "Dump Samples", "grab Samples", "TR Samples", "DD Samples", "tailing group"]
    gap_rows = []

    for group in groups:
        df_group = df[df['Sample Group'] == group]
        if len(df_group) < 2:
            continue
        streams = {}
        for _, row in df_group.iterrows():
            c = parse_sample_components(row['Sample ID'])
            if c["num"] is None:
                continue
            if c["prefix"] in [p.upper() for p in EXCLUDED_GAP_PREFIXES]:
                continue
            key = (group, c["prefix"])
            streams.setdefault(key, {"items": [], "raw_prefix": c["raw_prefix"], "width": c["width"]})
            streams[key]["items"].append(c["num"])

        for (g, pref), stream in streams.items():
            if len(stream["items"]) < 2:
                continue
            nums = sorted(set(stream["items"]))
            lo, hi = nums[0], nums[-1]
            for n in range(lo + 1, hi):
                if n not in set(nums):
                    gap_id = stream["raw_prefix"] + str(n).zfill(stream["width"])
                    gap_rows.append({'Sample ID': gap_id, 'FAS-211 Au ppm': 'GAP / MISSING',
                                     'Job Received Date': 'MISSING', 'Job Report Date': 'MISSING',
                                     'Sample Group': g, 'Job ID': 'GAP - NOT REPORTED'})

    if gap_rows:
        df = pd.concat([df, pd.DataFrame(gap_rows)], ignore_index=True)
    return df


def run_consolidation_workflow():
    all_reports = glob.glob(os.path.join(INPUT_DIR, "*.csv"))
    if not all_reports:
        print(f"No CSV assay reports found in {INPUT_DIR}!")
        return

    compiled = []
    for path in all_reports:
        try:
            compiled.append(extract_and_transform(path))
        except Exception as e:
            print(f"Error parsing {path}: {e}")

    if compiled:
        master = pd.concat(compiled, ignore_index=True)
        master = detect_and_insert_sequence_gaps(master)
        os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
        master.to_csv(OUTPUT_FILE, index=False)

        real = master[master['FAS-211 Au ppm'] != 'GAP / MISSING']
        dup_ids = real['Sample ID'][real['Sample ID'].duplicated(keep=False)].unique().tolist()
        print(f"Success! Master saved with {len(master)} rows to {OUTPUT_FILE}")
        if dup_ids:
            print(f"WARNING: {len(dup_ids)} duplicate sample ID(s) found: {dup_ids[:20]}")
        else:
            print("No duplicate sample IDs detected.")


if __name__ == "__main__":
    run_consolidation_workflow()`;

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-sm space-y-6">
                  <h3 className="text-sm font-semibold text-slate-200 uppercase">📌 Sample Issue & Misnumbering Registry</h3>

                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                      <p className="text-[11px] text-slate-400 uppercase font-semibold mb-1">Registry Source</p>
                      <p className="text-xs text-slate-200 font-mono flex items-center gap-2">
                        <span className="text-teal-400">●</span> {registrySourceName}
                      </p>
                      <p className="text-[10px] text-slate-500 mt-1">Default CSV loads on start. Import a different file to change source, or download to update the CSV.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <label className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[11px] font-semibold border border-slate-700 cursor-pointer">
                        📥 Import Registry CSV
                        <input type="file" accept=".csv" onChange={handleImportRegistry} className="hidden" />
                      </label>
                      <button onClick={handleDownloadRegistry} disabled={!sampleIssues.length} className="px-3 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded text-[11px] font-semibold disabled:opacity-40 disabled:cursor-not-allowed">
                        💾 Download CSV
                      </button>
                      <button onClick={resetRegistryToDefault} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[11px] font-semibold border border-slate-700">
                        ↺ Reset Default
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleAddSampleIssue} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Sample ID in Report:</label>
                        <input type="text" value={newIssueSampleId} onChange={e => setNewIssueSampleId(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Issue Type:</label>
                        <select value={newIssueType} onChange={e => setNewIssueType(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white">
                          {REGISTRY_ISSUE_TYPES.map(t => (
                            <option key={t} value={t}>{t}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Corrected Sample ID (optional):</label>
                        <input type="text" value={newIssueCorrectedId} onChange={e => setNewIssueCorrectedId(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white" placeholder="Only if the ID was corrected" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Status:</label>
                        <select value={newIssueStatus} onChange={e => setNewIssueStatus(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white">
                          <option value="Open">Open</option>
                          <option value="Resolved">Resolved</option>
                        </select>
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-[11px] text-slate-400 mb-1">Notes / Description:</label>
                        <input type="text" value={newIssueNotes} onChange={e => setNewIssueNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white" placeholder="e.g. Oil spilled on sample, cannot be analyzed" />
                      </div>
                    </div>
                    <button type="submit" className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded text-xs font-semibold">+ Save Issue Entry</button>
                  </form>

                  {sampleIssues.length > 0 && (
                    <div className="space-y-2">
                      {sampleIssues.map((iss, idx) => (
                        <div key={idx} className="flex items-center justify-between p-3 bg-slate-900 rounded-lg border border-slate-800 text-xs">
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-slate-200 font-bold font-mono">{iss.sampleId}</span>
                              {iss.correctedId && iss.correctedId !== iss.sampleId && (
                                <span className="text-slate-500 mx-1">→</span>
                              )}
                              {iss.correctedId && iss.correctedId !== iss.sampleId && (
                                <span className="text-teal-300 font-mono">{iss.correctedId}</span>
                              )}
                              <span className="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide bg-rose-500/20 text-rose-300 border border-rose-500/30">{iss.issueType}</span>
                              <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wide ${iss.status === 'Resolved' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}`}>{iss.status}</span>
                            </div>
                            <span className="text-slate-500 block text-[10px] mt-0.5">{iss.notes}</span>
                          </div>
                          <button onClick={() => removeSampleIssue(idx)} className="text-rose-400 hover:text-rose-300 px-2 py-1">✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'validation' && (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-sm space-y-6">
                  <h3 className="text-sm font-semibold text-slate-200 uppercase">Prefix-Aware Sequence Gap Inspection Board</h3>
                  {(() => {
                    const totalGapCount = Object.keys(sequenceGapSummary.stats).reduce((sum, k) => sum + sequenceGapSummary.stats[k].missing, 0);
                    return totalGapCount === 0 && filesStatus.length > 0 ? (
                      <div className="p-4 rounded-xl border bg-emerald-950/10 border-emerald-900/40 text-emerald-400 text-xs">
                        ✓ No sequence gaps detected across all loaded dispatches.
                      </div>
                    ) : null;
                  })()}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="text-slate-400 font-semibold border-b border-slate-800 uppercase text-[10px]">
                          <th className="py-2">Group & Prefix Stream</th>
                          <th className="py-2">Bounds</th>
                          <th className="py-2 text-center">Expected</th>
                          <th className="py-2 text-center">Present</th>
                          <th className="py-2 text-center">Gaps</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {Object.keys(sequenceGapSummary.stats).map((label, i) => {
                          const st = sequenceGapSummary.stats[label];
                          return (
                            <tr key={i}>
                              <td className="py-2.5 font-semibold text-slate-300">{label}</td>
                              <td className="py-2.5 font-mono text-slate-400">{st.min} ➔ {st.max}</td>
                              <td className="py-2.5 text-center">{st.expected}</td>
                              <td className="py-2.5 text-center">{st.actual}</td>
                              <td className={`py-2.5 text-center font-bold ${st.missing > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                                {st.missing}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {(() => {
                    const totalGapCount = Object.keys(sequenceGapSummary.stats).reduce((sum, k) => sum + sequenceGapSummary.stats[k].missing, 0);
                    if (totalGapCount > 0) {
                      const gapSpans = [];
                      Object.keys(sequenceGapSummary.stats).forEach(label => {
                        const st = sequenceGapSummary.stats[label];
                        st.ranges.forEach(r => gapSpans.push(`${label}: ${r}`));
                      });
                      return (
                        <div className="p-4 rounded-xl border bg-rose-950/10 border-rose-900/40">
                          <h4 className="text-xs font-bold text-rose-400 uppercase mb-2">⚠️ Missing Serial Ranges Found</h4>
                          <div className="flex flex-wrap gap-2">
                            {gapSpans.map((s, i) => (
                              <span key={i} className="text-[10px] bg-rose-500/10 text-rose-300 border border-rose-500/30 rounded px-2 py-1 font-mono">{s}</span>
                            ))}
                          </div>
                        </div>
                      );
                    }
                    return null;
                  })()}
                </div>
              )}

              {activeTab === 'python_code' && (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col gap-4">
                  <div>
                    <h3 className="text-sm font-semibold text-slate-300 uppercase mb-2">🐍 Tailored Python Script Builder</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      This script is dynamically customized to mirror your active rules. It reads every CSV from <code className="text-teal-400">Z:\public\Assay\Done</code> and writes the consolidated master file — automating the whole workflow offline.
                    </p>
                  </div>

                  <div className="relative">
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(generatePythonScript());
                        triggerNotification("Python code copied to clipboard!", "success");
                      }}
                      className="absolute right-3 top-3 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded border border-slate-700 transition-all font-medium"
                    >
                      Copy Script
                    </button>
                    <pre className="bg-slate-900 text-[10px] md:text-xs font-mono p-4 rounded-lg overflow-x-auto border border-slate-800 text-slate-300 max-h-[450px]">
                      <code>{generatePythonScript()}</code>
                    </pre>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
