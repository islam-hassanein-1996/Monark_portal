    // --- CSV Parsing Utility ---
    function parseCSV(text) {
      let lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') {
            i++;
          }
          lines.push(row);
          row = [""];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }
      return lines;
    }

    };

    // --- Classification grouping logic ---
    const getSampleGroup = (sampleId) => {
      const idClean = (sampleId || "").toString().trim();
      const idUpper = idClean.toUpperCase();
      
      // Extract numerical parts
      const numPart = idClean.replace(/\D/g, "");
      const num = numPart ? parseInt(numPart, 10) : null;

      // 1. Specific designated ranges first (regardless of prefix)
      if (num !== null) {
        if (num >= 8501 && num <= 8600) {
          return "Alluvial Materials group";
        }
        if (num >= 8747 && num <= 8782) {
          return "tailing group";
        }
      }

      // 2. Alphabetic Prefix Rules
      if (idUpper.startsWith("SD")) {
        return "Dump Samples";
      }
      if (idUpper.startsWith("CR")) {
        return "Crusher Samples";
      }
      
      // 3. Sequential numeric ranges
      if (num !== null) {
        if (num >= 0 && num <= 9999) {
          return "grab Samples";
        }
        if (num >= 10000 && num <= 99999) {
          return "TR Samples";
        }
        if (num >= 100000) {
          return "DD Samples";
        }
      }
      
      return "other samples";
    };

    // --- Helper to build gap IDs preserving correct prefixes and padding ---
    const getSampleIdFormatter = (samplesInGroup, groupName) => {
      const rep = samplesInGroup.find(s => !s.isGapPlaceholder && !s.isQaqc);
      if (!rep) {
        return (val) => String(val);
      }
      const rawId = rep.sampleId.trim();
      
      // Extract prefix (letters)
      const prefixMatch = rawId.match(/^([A-Za-z]+)/);
      const prefix = prefixMatch ? prefixMatch[1] : "";
      
      // Extract numerical padding width
      const digitsMatch = rawId.match(/(\d+)$/);
      const paddingWidth = digitsMatch ? digitsMatch[1].length : 4;

      return (val) => {
        const padded = String(val).padStart(paddingWidth, '0');
        return prefix + padded;
      };
    };

    // --- Sequence Gap Detection Engine (Optimized with Dynamic Bounds Calculation) ---
    const detectGapsInSequence = (samples) => {
      const groupsToInspect = [
        "Dump Samples", 
        "Crusher Samples", 
        "grab Samples", 
        "TR Samples", 
        "DD Samples", 
        "tailing group", 
        "Alluvial Materials group"
      ];
      
      const gapRecords = [];
      const stats = {};

      groupsToInspect.forEach(groupName => {
        // Isolate samples matching this group
        const groupSamples = samples.filter(s => s.group === groupName && !s.isQaqc && !s.isGapPlaceholder);
        
        // Extract raw integers
        const nums = groupSamples
          .map(s => {
            const numPart = s.sampleId.replace(/\D/g, "");
            return numPart ? parseInt(numPart, 10) : NaN;
          })
          .filter(n => !isNaN(n));

        if (nums.length < 2) {
          stats[groupName] = { min: "N/A", max: "N/A", expected: 0, actual: nums.length, missing: 0, ranges: [] };
          return;
        }

        // DYNAMIC BOUNDS CALCULATION
        nums.sort((a, b) => a - b);
        const presentSet = new Set(nums);
        const minNum = nums[0];
        const maxNum = nums[nums.length - 1];
        const expectedCount = (maxNum - minNum) + 1;
        const missingList = [];

        // Identify gaps *ONLY* between min and max
        for (let num = minNum + 1; num < maxNum; num++) {
          if (!presentSet.has(num)) {
            missingList.push(num);
          }
        }

        // Collapse continuous missing numbers into human-readable ranges
        const missingRanges = [];
        const formatId = getSampleIdFormatter(groupSamples, groupName);

        if (missingList.length > 0) {
          let rangeStart = missingList[0];
          let prevNum = rangeStart;
          
          for (let k = 1; k <= missingList.length; k++) {
            const currentNum = missingList[k];
            if (currentNum === prevNum + 1) {
              prevNum = currentNum;
            } else {
              missingRanges.push(rangeStart === prevNum ? formatId(rangeStart) : `${formatId(rangeStart)} - ${formatId(prevNum)}`);
              
              // Generate Virtual Placeholders
              for (let fill = rangeStart; fill <= prevNum; fill++) {
                gapRecords.push({
                  sampleId: formatId(fill),
                  rawGrade: "GAP",
                  grade: "GAP / MISSING",
                  numericGrade: -1, 
                  isBelowDetection: false,
                  isQaqc: false,
                  jobId: "GAP - NOT REPORTED",
                  receivedDate: "MISSING",
                  reportDate: "MISSING",
                  fileName: "N/A",
                  group: groupName,
                  isGapPlaceholder: true
                });
              }

              if (currentNum !== undefined) {
                rangeStart = currentNum;
                prevNum = currentNum;
              }
            }
          }
        }

        stats[groupName] = {
          min: formatId(minNum),
          max: formatId(maxNum),
          expected: expectedCount,
          actual: nums.length,
          missing: missingList.length,
          ranges: missingRanges
        };
      });

      return { gapRecords, stats };
    };

    // --- Main Application Component ---
    function App() {
      // Predefined workspace files
      const workspaceFiles = [
        "RMF2610239-MCFE.csv",

      const [filesStatus, setFilesStatus] = useState([]);

      const [notification, setNotification] = useState(null);

        setNotification({ message, type });

      const handleLoadPreloadedWorkspace = () => {

        const newStatus = [];
        const cachedRawData = {};

        workspaceFiles.forEach(fileName => {
          try {
            const csvText = EMBEDDED_CSV_DATA[fileName];
            if (!csvText) {
              throw new Error(`Data missing in embedded code segment`);
            }
            const rawRows = parseCSV(csvText);
            cachedRawData[fileName] = rawRows;

            newStatus.push({
              name: fileName,
              status: 'success',
              size: `${(csvText.length / 1024).toFixed(1)} KB`
            });

          } catch (err) {

        setRawFilesData(cachedRawData);
        setFilesStatus(newStatus);
        setIsProcessing(false);
        triggerNotification("Loaded all preloaded laboratory reports successfully!", "success");

      // Re-run extraction mapping when filters or strategies change
      const rebuildConsolidatedDatabase = () => {
        let combined = [];
        setProcessLogs(prev => [...prev, "Running consolidation mapper with active rules..."]);

        Object.keys(rawFilesData).forEach(fileName => {
          const rows = rawFilesData[fileName];
          const parsed = extractAssayReportData(fileName, rows);
          combined = [...combined, ...parsed.samples];
        });

        // Inject calculated serial gaps if enabled (using our new Dynamic Bounds calculation)
        if (insertGaps) {
          const { gapRecords } = detectGapsInSequence(combined);
          if (gapRecords.length > 0) {
            setProcessLogs(prev => [...prev, `Sequence Analyzer identified ${gapRecords.length} skipped serial numbers. Merging gap entries.`]);
            combined = [...combined, ...gapRecords];
          } else {
            setProcessLogs(prev => [...prev, `Sequence Analyzer checked bounds: No skipped serials discovered.`]);
          }
        }

        setConsolidatedData(combined);
        setProcessLogs(prev => [...prev, `Mapped database rebuilt. Total production records: ${combined.length}`]);
      };

      // Watch for rule changes or input file modifications to trigger rebuild
      useEffect(() => {
        if (Object.keys(rawFilesData).length > 0) {

      // General CSV File Uploader Handler
      const handleFileUpload = (event) => {
        const files = Array.from(event.target.files);
        if (!files.length) return;

        setIsProcessing(true);
        setProcessLogs(prev => [...prev, `Custom upload detected: ${files.length} file(s)...`]);

        let processedCount = 0;
        const tempRawData = { ...rawFilesData };

        files.forEach(file => {
          const reader = new FileReader();

            const text = e.target.result;
            const rawRows = parseCSV(text);
            
            tempRawData[file.name] = rawRows;

              const existsIdx = prev.findIndex(f => f.name === file.name);
              const meta = { name: file.name, status: 'success', size: `${(file.size / 1024).toFixed(1)} KB` };
              if (existsIdx > -1) {
                const copy = [...prev];
                copy[existsIdx] = meta;
                return copy;

              return [...prev, meta];

def extract_and_transform(file_path):

            df_data['Sample ID'].astype(str).str.upper().str.contains("AMIS") |
            df_data['Sample ID'].astype(str).str.upper().str.contains("G316")
        )
        df_data = df_data[~qaqc_mask]

    def parse_detection_limit(val):
        val_str = str(val).strip()

            limit_val = float(val_str.replace("<", ""))
            if DETECTION_STRATEGY == "zero":

            elif DETECTION_STRATEGY == "custom":
                return CUSTOM_SUB_VALUE
            else:
                return val_str
        return val_str

    df_data['FAS-211 Au ppm'] = df_data['Au_ppm'].apply(parse_detection_limit)
    
    df_data['Job Received Date'] = job_received_date
    df_data['Job Report Date'] = job_report_date
    df_data['Job ID'] = job_id

    final_cols = ['Sample ID', 'FAS-211 Au ppm', 'Job Received Date', 'Job Report Date', 'Sample Group', 'Job ID']
    return df_data[final_cols]

def detect_and_insert_sequence_gaps(df):
    """
    Scans the DataFrame for sequential missing numeric IDs exclusively within 
    the active dynamic range of each geological group.
    """
    groups = ["Dump Samples", "Crusher Samples", "grab Samples", "TR Samples", "DD Samples", "tailing group", "Alluvial Materials group"]
    gap_rows = []
    
    for group in groups:
        df_group = df[df['Sample Group'] == group]
        if len(df_group) < 2:
            continue
            
        nums = []
        formats = {} # Maps numeric value to its (Prefix, Padding Width)
        
        for idx, row in df_group.iterrows():
            id_val = str(row['Sample ID']).strip()
            num_part = ''.join(filter(str.isdigit, id_val))
            if num_part:
                n = int(num_part)
                nums.append(n)
                
                # Capture the text prefix of the ID
                prefix = ""
                for char in id_val:
                    if char.isalpha():
                        prefix += char
                    else:
                        break
                formats[n] = (prefix, len(num_part))
                
        if not nums:
            continue
            
        nums = sorted(list(set(nums)))
        min_n, max_n = nums[0], nums[-1]
        
        default_prefix, default_width = formats.get(nums[0], ("", 4))
        
        # Scans gap numbers ONLY inside actual bounds
        for n in range(min_n + 1, max_n):
            if n not in formats:
                pad_str = str(n).zfill(default_width)
                gap_id = f"{default_prefix}{pad_str}"
                
                gap_rows.append({
                    'Sample ID': gap_id,
                    'FAS-211 Au ppm': 'GAP / MISSING',
                    'Job Received Date': 'MISSING',
                    'Job Report Date': 'MISSING',
                    'Sample Group': group,
                    'Job ID': 'GAP - NOT REPORTED'
                })
                
    if gap_rows:
        df_gaps = pd.DataFrame(gap_rows)
        df = pd.concat([df, df_gaps], ignore_index=True)
    return df

def run_consolidation_workflow():
    all_reports = glob.glob(os.path.join(INPUT_DIR, "*.csv"))
    if not all_reports:
        print(f"No matching CSV assay reports found in {INPUT_DIR}!")
        return
        
    compiled_list = []
    for report_path in all_reports:
        try:
            df_mapped = extract_and_transform(report_path)
            compiled_list.append(df_mapped)
        except Exception as e:
            print(f"Error parsing file {report_path}: {e}")
            
    if compiled_list:
        master_df = pd.concat(compiled_list, ignore_index=True)
        master_df = detect_and_insert_sequence_gaps(master_df)
        
        os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
        master_df.to_csv(OUTPUT_FILE, index=False)
        print(f"Success! Master database saved with {len(master_df)} rows to {OUTPUT_FILE}")

if __name__ == "__main__":
    run_consolidation_workflow()`;

                        { id: 'other samples', label: 'Other Codes' }
                      ].map(btn => (
                        <button
                          key={btn.id}
                          onClick={() => { setGroupFilter(btn.id); setCurrentPage(1); }}
                          className={`text-xs px-2.5 py-1 rounded transition-all ${
                            groupFilter === btn.id
                              ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                              : 'bg-slate-900 hover:bg-slate-800 text-slate-400'
                          }`}
                        >
                          {btn.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-x-auto min-h-[300px]">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-900/60 text-slate-400 text-[10px] font-semibold uppercase tracking-wider border-b border-slate-800">
                          {[
                            { id: 'sampleId', label: 'Sample ID' },
                            { id: 'group', label: 'Class / Source Group' },
                            { id: 'grade', label: 'FAS-211 Au ppm' },
                            { id: 'receivedDate', label: 'Job Received Date' },
                            { id: 'reportDate', label: 'Job Report Date' },
                            { id: 'jobId', label: 'Job ID' }
                          ].map(col => (
                            <th 
                              key={col.id} 
                              onClick={() => requestSort(col.id)}
                              className="py-3 px-4 cursor-pointer hover:bg-slate-800 hover:text-white transition-colors select-none"
                            >
                              <div className="flex items-center gap-1.5">
                                {col.label}
                                {sortBy.column === col.id ? (
                                  sortBy.direction === 'asc' ? '▲' : '▼'
                                ) : '↕'}
                              </div>
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-xs">
                        {currentRecords.length === 0 ? (
                          <tr>
                            <td colSpan="6" className="py-16 text-center text-slate-500 text-xs">
                              {totalSamples === 0 
                                ? "No CSV files have been loaded into the registry."
                                : "No assay records match the current search filters."}
                            </td>
                          </tr>
                        ) : (
                          currentRecords.map((rec, i) => (
                            <tr 
                              key={i} 
                              className={`hover:bg-slate-900/50 transition-colors ${
                                rec.isGapPlaceholder 
                                  ? 'bg-rose-500/5 hover:bg-rose-500/10 border-l-2 border-rose-500' 
                                  : rec.numericGrade >= 1.0 
                                  ? 'bg-amber-500/5' 
                                  : ''
                              }`}
                            >
                              <td className={`py-2.5 px-4 font-mono font-medium ${rec.isGapPlaceholder ? 'text-rose-400 font-bold' : 'text-slate-200'}`}>
                                {rec.sampleId}
                              </td>
                              <td className="py-2.5 px-4">
                                <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-semibold ${getBadgeClass(rec.group)}`}>
                                  {rec.group}
                                </span>
                              </td>
                              <td className="py-2.5 px-4">
                                {rec.isGapPlaceholder ? (
                                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 font-bold border border-rose-500/30 uppercase text-[10px]">
                                    GAP / MISSING
                                  </span>
                                ) : rec.numericGrade >= 1.0 ? (
                                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-amber-500/15 border border-amber-500/35 font-mono text-amber-300 font-bold">
                                    {rec.grade} <span className="text-[10px]">★</span>
                                  </span>
                                ) : rec.isBelowDetection ? (
                                  <span className="font-mono text-slate-500 italic">{rec.grade}</span>
                                ) : (
                                  <span className="font-mono text-slate-300">{rec.grade}</span>
                                )}
                              </td>
                              <td className={`py-2.5 px-4 ${rec.isGapPlaceholder ? 'text-rose-400/50 italic' : 'text-slate-400'}`}>{rec.receivedDate}</td>
                              <td className={`py-2.5 px-4 ${rec.isGapPlaceholder ? 'text-rose-400/50 italic' : 'text-slate-400'}`}>{rec.reportDate}</td>
                              <td className={`py-2.5 px-4 font-mono text-[11px] ${rec.isGapPlaceholder ? 'text-rose-400/50 italic' : 'text-teal-400'}`}>{rec.jobId}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  {totalPages > 1 && (
                    <div className="p-4 border-t border-slate-800 flex justify-between items-center text-xs bg-slate-950/60">
                      <span className="text-slate-500">
                        Showing <span className="text-slate-300 font-medium">{indexOfFirstRecord + 1}</span> to <span className="text-slate-300 font-medium">{Math.min(indexOfLastRecord, sortedRecords.length)}</span> of <span className="text-slate-300 font-medium">{sortedRecords.length}</span> records
                      </span>
                      <div className="flex gap-1">
                        <button
                          onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                          disabled={currentPage === 1}
                          className="px-2.5 py-1 rounded bg-slate-900 text-slate-400 border border-slate-800 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800"
                        >
                          ◄ Prev
                        </button>
                        <span className="px-3 py-1 bg-slate-800 border border-slate-700 rounded text-slate-200">
                          Page {currentPage} of {totalPages}
                        </span>
                        <button
                          onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                          disabled={currentPage === totalPages}
                          className="px-2.5 py-1 rounded bg-slate-900 text-slate-400 border border-slate-800 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800"
                        >
                          Next ►
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 3: VERIFICATION & GAP INSPECTOR */}
              {activeTab === 'validation' && (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-sm space-y-6">
                  <div>
                    <h3 className="text-sm font-semibold text-slate-300 tracking-wide uppercase mb-2">Automated Audit Inspection Board</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Below-checks run instant diagnostics over your merged dataset. Red flags point to inconsistencies inside the source files or transfer losses.
                    </p>
                  </div>

                  {totalSamples === 0 ? (
                      <div className="text-center py-10 text-xs text-slate-600 border border-slate-800 border-dashed rounded bg-slate-900/30">
                          Load files to run validations.
                      </div>
                  ) : (
                    <div className="space-y-6">
                      
                      {/* SEQUENCE GAP ANALYZER BOARD */}
                      <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow">
                        <h4 className="text-xs font-bold text-teal-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242z" />
                          </svg>
                          System Sequence Integrity Log (DYNAMIC RANGE BOUNDS)
                        </h4>
                        
                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse text-xs">
                            <thead>
                              <tr className="text-slate-400 font-semibold border-b border-slate-800 uppercase text-[10px] tracking-wider">
                                <th className="py-2">Group Classification</th>
                                <th className="py-2">Active Bounds</th>
                                <th className="py-2 text-center">Expected</th>
                                <th className="py-2 text-center">Present</th>
                                <th className="py-2 text-center">Gaps Found</th>
                                <th className="py-2 text-right">Fidelity Status</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {Object.keys(sequenceGapSummary.stats).map((gName, i) => {
                                const st = sequenceGapSummary.stats[gName];
                                return (
                                  <tr key={i} className="hover:bg-slate-850/50">
                                    <td className="py-3 font-semibold text-slate-300">{gName}</td>
                                    <td className="py-3 font-mono text-slate-400">{st.min} ➔ {st.max}</td>
                                    <td className="py-3 text-center text-slate-300">{st.expected}</td>
                                    <td className="py-3 text-center text-slate-300">{st.actual}</td>
                                    <td className={`py-3 text-center font-bold ${st.missing > 0 ? 'text-rose-400 animate-pulse' : 'text-emerald-400'}`}>
                                      {st.missing}
                                    </td>
                                    <td className="py-3 text-right">
                                      {st.missing > 0 ? (
                                        <span className="text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded font-semibold">
                                          ⚠️ GAP DEVIATION
                                        </span>
                                      ) : st.expected === 0 ? (
                                        <span className="text-[10px] bg-slate-800 text-slate-500 px-2 py-0.5 rounded font-semibold">
                                          NO SEQUENCE
                                        </span>
                                      ) : (
                                        <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-semibold">
                                          ✓ INTEGRITY SEALED
                                        </span>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                        {/* DETECTED GAP SERIAL NUMBERS */}
                        {totalGapsCount > 0 && (
                          <div className="mt-4 pt-4 border-t border-slate-800">
                            <span className="text-[11px] font-semibold text-rose-400 block mb-2 uppercase tracking-wide">
                              Lost/Skipped Serial Ranges Discovered inside bounds:
                            </span>
                            <div className="flex flex-wrap gap-2">
                              {Object.keys(sequenceGapSummary.stats).map(gName => {
                                const st = sequenceGapSummary.stats[gName];
                                return st.ranges.map((rng, rIdx) => (
                                  <span key={`${gName}-${rIdx}`} className="text-xs bg-rose-500/10 text-rose-300 border border-rose-500/30 rounded px-2.5 py-1 font-mono">
                                    <strong className="text-rose-400 font-sans mr-1">[{gName.split(" ")[0]}]:</strong> {rng}
                                  </span>
                                ));
                              })}
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Check 1 */}
                      <div className={`p-4 rounded-xl border flex gap-4 ${
                        duplicateAlerts.length > 0 ? 'bg-amber-950/10 border-amber-900/40' : 'bg-emerald-950/10 border-emerald-900/40'
                      }`}>
                        <span className={`text-xl flex-shrink-0 ${duplicateAlerts.length > 0 ? 'text-amber-500' : 'text-emerald-500'}`}>
                          {duplicateAlerts.length > 0 ? '⚠️' : '✓'}
                        </span>
                        <div>
                          <h4 className="text-xs font-semibold text-slate-200 mb-1">Duplicate Sample ID Scan</h4>
                          <p className="text-[11px] text-slate-400 leading-relaxed">
                            {duplicateAlerts.length > 0 
                              ? `Found ${duplicateAlerts.length} duplicate identifier(s) in merged batch! Duplicate keys: [${duplicateAlerts.slice(0, 5).join(', ')}${duplicateAlerts.length > 5 ? '...' : ''}]. Check if same sample was submitted multiple times.`
                              : "Success! Zero duplicate sample IDs detected across all loaded reports. Every sample contains a unique tracking key."}
                          </p>
                        </div>
                      </div>

                      {/* Check 2 */}
                      {(() => {
                        const emptyFields = consolidatedData.filter(s => !s.isGapPlaceholder).filter(s => !s.sampleId || !s.grade || !s.receivedDate || !s.reportDate);
                        const isSuccess = emptyFields.length === 0;
                        return (
                          <div className={`p-4 rounded-xl border flex gap-4 ${
                            !isSuccess ? 'bg-rose-950/10 border-rose-900/40' : 'bg-emerald-950/10 border-emerald-900/40'
                          }`}>
                            <span className={`text-xl flex-shrink-0 ${!isSuccess ? 'text-rose-500' : 'text-emerald-500'}`}>
                              {!isSuccess ? '❌' : '✓'}
                            </span>
                            <div>
                              <h4 className="text-xs font-semibold text-slate-200 mb-1">Null / Empty Value Scan</h4>
                              <p className="text-[11px] text-slate-400 leading-relaxed">
                                {!isSuccess
                                  ? `Warning: Found ${emptyFields.length} records containing blank critical fields. Clear out formatting spacing inside original CSVs.`
                                  : "Excellent. Every row contains a complete set of attributes (ID, FAS-211 grade, received date, and report date). No gaps or missing segments found."}
                              </p>
                            </div>
                          </div>
                        );
                      })()}

                      {/* Check 3 */}
                      <div className="p-4 rounded-xl border bg-slate-900/40 border-slate-800/80 flex gap-4">
                        <span className="text-xl text-teal-400 flex-shrink-0">⚙</span>
                        <div>
                          <h4 className="text-xs font-semibold text-slate-200 mb-1">Row Count Reconciliation Log</h4>
                          <p className="text-[11px] text-slate-400 leading-relaxed mb-3">
                            Reconcile raw input report lines against processed output records:
                          </p>
                          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                            {filesStatus.map((f, i) => {
                              const count = consolidatedData.filter(s => s.fileName === f.name).length;
                              return (
                                <div key={i} className="bg-slate-950 p-2.5 rounded border border-slate-800 font-mono text-[10px]">
                                  <span className="text-slate-500 block truncate" title={f.name}>{f.name}</span>
                                  <span className="text-slate-200 font-bold block mt-1">{count} Samples Mapped</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 4: PYTHON */}
              {activeTab === 'python_code' && (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col gap-4">
                  <div>
                    <h3 className="text-sm font-semibold text-slate-300 tracking-wide uppercase mb-2">Tailored Python Script Builder</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      This Python script is dynamically customized to mirror your selected consolidation strategy (Below Detection, QA/QC visibility, path settings). Drag it to your local environment to automate your weekly work loop!
                    </p>
                  </div>

                  <div className="relative">
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(generatePythonScript());
                        triggerNotification("Python code copied to clipboard!", "success");
                      }}
                      className="absolute right-3 top-3 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded border border-slate-700 transition-all font-medium"
                    >
                      Copy Script
                    </button>
                    <pre className="bg-slate-900 text-[10px] md:text-xs font-mono p-4 rounded-lg overflow-x-auto border border-slate-800 text-slate-300 max-h-[450px]">
                      <code>{generatePythonScript()}</code>
                    </pre>
                  </div>

                  <div className="bg-teal-950/10 border border-teal-900/30 rounded-lg p-4 text-xs text-teal-400">
                    <h4 className="font-semibold mb-1">🐍 How to Run Local Automation:</h4>
                    <ol className="list-decimal list-inside space-y-1 text-slate-400 text-[11px] leading-relaxed">
                      <li>Create a Python file named <code className="text-teal-400">assay_merger.py</code> in your project directory.</li>
                      <li>Copy and paste the code block above into the file.</li>
                      <li>Ensure your input CSV reports are saved inside a subfolder named <code className="text-teal-400">02_In_Progress</code>.</li>
                      <li>Run the command <code className="text-teal-400">python assay_merger.py</code> in your terminal.</li>
                    </ol>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
