<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example static page</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; }
    </style>
  </head>
  <body>
    <h1>Example static page</h1>
    <p>
      Drop existing standalone HTML pages into <code>public/pages/</code>. Register one in
      <code>portal_apps</code> with <code>kind = 'static'</code> and <code>url = 'example.html'</code>
      and it appears on the dashboard for whoever has access.
    </p>
  </body>
</html>
