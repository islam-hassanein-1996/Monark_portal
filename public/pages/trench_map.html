<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trench Sampling & Structures Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  height:100vh;display:flex;flex-direction:column;
  background:#1a1d23;color:#e4e4e7
}
:root{
  --bg-panel:#1e2130;--bg-toolbar:#161824;--accent:#4fc3f7;
  --accent2:#81c784;--warn:#ffb74d;--danger:#ef5350;
  --border:rgba(255,255,255,0.08);--text-muted:#8892a4
}
#toolbar{
  background:var(--bg-toolbar);color:#e4e4e7;
  padding:8px 14px;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;font-size:12px;
  z-index:1001;min-height:48px;border-bottom:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,0,0,0.3)
}
#toolbar label{
  font-size:10px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:0.5px;display:flex;flex-direction:column;gap:2px
}
#toolbar select,#toolbar input{
  padding:5px 8px;border-radius:5px;border:1px solid var(--border);
  font-size:11px;background:#2a2d3a;color:#e4e4e7;outline:none;
  transition:border-color 0.2s
}
#toolbar select:focus,#toolbar input:focus{border-color:var(--accent)}
#toolbar button{
  padding:6px 16px;border:none;border-radius:5px;cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:0.3px;
  transition:all 0.2s;text-transform:uppercase
}
#btnInterpolate{background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff}
#btnInterpolate:hover{background:linear-gradient(135deg,#388e3c,#43a047);transform:translateY(-1px);box-shadow:0 3px 10px rgba(67,160,71,0.3)}
#btnInterpolate:disabled{background:#3a3f50;color:#6b7280;cursor:not-allowed;transform:none;box-shadow:none}
#btnLoadExcel{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}
#btnLoadExcel:hover{background:linear-gradient(135deg,#1565c0,#1e88e5);transform:translateY(-1px);box-shadow:0 3px 10px rgba(25,118,210,0.3)}
#btnExport{background:linear-gradient(135deg,#ef6c00,#ff9800);color:#fff}
#btnExport:hover{background:linear-gradient(135deg,#e65100,#fb8c00);transform:translateY(-1px);box-shadow:0 3px 10px rgba(239,108,0,0.3)}
#btnExportView{background:linear-gradient(135deg,#7b1fa2,#ab47bc);color:#fff}
#btnExportView:hover{background:linear-gradient(135deg,#6a1b9a,#9c27b0);transform:translateY(-1px);box-shadow:0 3px 10px rgba(123,31,162,0.3)}
#btnLocateMe{background:linear-gradient(135deg,#0277bd,#29b6f6);color:#fff;width:34px;height:34px;padding:0;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#btnLocateMe:hover{background:linear-gradient(135deg,#01579b,#0288d1);transform:translateY(-1px);box-shadow:0 3px 10px rgba(2,119,189,0.3)}
#btnLocateMe.locating{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#searchInput{padding:5px 24px 5px 8px;border-radius:5px;border:1px solid var(--border);font-size:11px;background:#2a2d3a;color:#e4e4e7;outline:none;width:160px;transition:border-color 0.2s,width 0.2s}
#searchInput:focus{border-color:var(--accent);width:220px}
#searchInput::placeholder{color:var(--text-muted)}
#searchClear{position:absolute;right:78px;top:11px;background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;display:none;padding:0 2px;line-height:1;z-index:10}
#searchClear.visible{display:block}
#status{
  font-size:11px;color:#b0bec5;margin-left:auto;text-align:right;
  max-width:55%;line-height:1.4;padding:2px 8px;
  background:rgba(255,255,255,0.04);border-radius:4px
}
.sep{color:var(--border);user-select:none}
#map{flex:1;width:100%;min-height:0}
.legend{
  background:rgba(30,33,48,0.95);color:#e4e4e7;
  padding:8px 10px;border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);line-height:1.4;
  font-size:11px;min-width:140px;border:1px solid var(--border);
  backdrop-filter:blur(8px)
}
.legend h4{margin:0 0 4px;font-size:12px;color:var(--accent);letter-spacing:0.5px}
.legend hr{border:none;border-top:1px solid var(--border);margin:5px 0}
.legend-item{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);flex-shrink:0}
.trench-label span{
  display:inline-block;padding:2px 5px;
  background:rgba(30,33,48,0.88);color:#e4e4e7;
  border-radius:3px;font-size:10px;font-weight:700;
  white-space:nowrap;border:1px solid rgba(255,255,255,0.15);
  pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,0.6);
  backdrop-filter:blur(4px)
}
.leaflet-control-layers-overlays label span{color:#444!important}
</style>
</head>
<body>
<div id="toolbar">
  <span style="font-weight:700;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:6px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10M12 2a15.3 15.3 0 00-4 10 15.3 15.3 0 004 10"/></svg>
    TR_Master Map
  </span>
  <span class="sep">|</span>
  <label>UTM Zone<select id="utmZone">

  <span class="sep">|</span>
  <label>Sampling<select id="sheetSampling"><option value="Sampling">Sampling</option></select></label>
  <label>Str<select id="sheetStr"><option value="Str">Str</option></select></label>

  <label>Sample Trench<select id="colSamplingTid"><option value="Trench_ID">Trench_ID</option></select></label>

  <button id="btnLoadExcel">Load Excel</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
  <button id="btnInterpolate">Interpolate & Map</button>
  <button id="btnExport">Export Coords CSV</button>
  <button id="btnExportView">Export View-Only</button>
  <span class="sep">|</span>
  <label>Basemap<select id="basemap">
    <option value="bing_aerial" selected>Bing Aerial</option>
    <option value="bing_road">Bing Road</option>
    <option value="google_sat">Google Satellite</option>
    <option value="google_hyb">Google Hybrid</option>
    <option value="sat">ESRI Satellite</option>
    <option value="geo">Geology (Macrostrat)</option>
    <option value="geo_sat">ESRI + Geology</option>
    <option value="bing_geosat">Bing + Geology</option>
    <option value="topo">ESRI Topo</option>
    <option value="osm">OSM Street</option>
  </select></label>
  <button id="btnLocateMe" title="GPS locate (mobile) or IP (desktop)">&#9678;</button>
  <input type="text" id="coordJump" placeholder="Lat,Lng or E N" style="width:140px;padding:5px 7px;border-radius:5px;border:1px solid var(--border);font-size:10px;background:#2a2d3a;color:#e4e4e7;outline:none;transition:border-color 0.2s,width 0.2s" onfocus="this.style.width='190px'" onblur="this.style.width='140px'">
  <span class="sep">|</span>
  <span style="position:relative;display:inline-flex;align-items:center">
    <input type="text" id="searchInput" placeholder="Search sample/trench...">
    <span id="searchClear" title="Clear search" onclick="clearSearch()" style="cursor:pointer;position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted);display:none;line-height:1">&times;</span>
  </span>
  <span id="status">Data loaded. Click "Interpolate & Map" to begin.</span>
</div>
<div id="map"></div>

// ---- Coordinate Jump ----
var _jumpMarker = null;
document.getElementById('coordJump').onkeydown=function(e){
  if(e.key!=='Enter')return;
  var val=this.value.trim();
  if(!val)return;
  var lat=null,lng=null;
  // Try lat,lng format
  var parts=val.split(/[,\s]+/).map(parseFloat).filter(function(v){return!isNaN(v);});
  if(parts.length>=2){
    // If both values look like geographic coords (|lat|<90,|lng|<180)
    if(Math.abs(parts[0])<=90&&Math.abs(parts[1])<=180&&val.indexOf(',')>=0){
      lat=parts[0];lng=parts[1];
    }else if(Math.abs(parts[0])<=90&&val.indexOf(',')>=0){
      lat=parts[0];lng=parts[1];
    // UTM: easting ~200000-600000, northing ~2000000-9000000
    }else if(parts[0]>100000&&parts[1]>1000000){
      var zone=parseInt(document.getElementById('utmZone').value);
      var ll=utmToLatLng(parts[0],parts[1],zone);
      lat=ll.lat;lng=ll.lng;
    }
  }
  if(lat===null||lng===null){
    document.getElementById('status').innerHTML='<span style="color:#ef5350">Invalid:</span> Use "lat,lng" or "easting northing"';
    return;
  }
  if(_jumpMarker)map.removeLayer(_jumpMarker);
  _jumpMarker=L.marker([lat,lng],{
    icon:L.divIcon({html:'<div style="width:14px;height:14px;background:#ff9800;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.5)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''})
  }).addTo(map);
  _jumpMarker.bindTooltip('Jump: '+lat.toFixed(6)+', '+lng.toFixed(6)+'<br>UTM: '+parts.map(function(v){return v.toFixed(0);}).join(' '),{permanent:true,direction:'top'}).openTooltip();
  map.setView([lat,lng],17);
  document.getElementById('status').innerHTML='<span style="color:#ff9800">Jumped to:</span> '+lat.toFixed(5)+', '+lng.toFixed(5);
};

function utmToLatLng(easting,northing,zone){
  var a=6378137, f=1/298.257223563, k0=0.9996;
  var b=a*(1-f);
  var e2=1-(b*b)/(a*a), ep2=e2/(1-e2);
  var e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  var x=easting-500000;
  var y=northing;
  var M=y/k0;
  var mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
  var phir=mu+(3*e1/2-27*e1*e1*e1/32)*Math.sin(2*mu)
    +(21*e1*e1/16-55*e1*e1*e1*e1/32)*Math.sin(4*mu)
    +(151*e1*e1*e1/96)*Math.sin(6*mu);
  var N1=a/Math.sqrt(1-e2*Math.sin(phir)*Math.sin(phir));
  var T1=Math.tan(phir)*Math.tan(phir);
  var C1=ep2*Math.cos(phir)*Math.cos(phir);
  var R1=a*(1-e2)/Math.pow(1-e2*Math.sin(phir)*Math.sin(phir),1.5);
  var D=x/(N1*k0);
  var lat=phir-(N1*Math.tan(phir)/R1)*(D*D/2
    -(5+3*T1+10*C1-4*C1*C1-9*ep2)*D*D*D*D/24
    +(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D*D*D*D*D*D/720);
  lat=lat*180/Math.PI;
  var lng0=(zone-1)*6-180+3;
  var lng=(D-(1+2*T1+C1)*D*D*D/6
    +(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D*D*D*D*D/120)/Math.cos(phir);
  lng=lng0+lng*180/Math.PI;
  return {lat:lat,lng:lng};
}

function interpolateAll(){
  var zone=parseInt(document.getElementById('utmZone').value);
  if(!samplesRaw.length||!strRaw.length){
    document.getElementById('status').innerText='No data. Load Excel first.';
    return;
  }
  document.getElementById('status').innerHTML='<span style="color:#ffb74d">Computing interpolation...</span>';
  document.getElementById('btnInterpolate').disabled=true;
  setTimeout(function(){
    try{
      var refs={};
      samplesRaw.forEach(function(s){
        if(!s.tid||s.e==null||s.n==null)return;
        var tid=String(s.tid).trim();
        if(!refs[tid])refs[tid]=[];
        refs[tid].push({d:s.dm,e:s.e,n:s.n,z:s.z});
      });
      Object.keys(refs).forEach(function(k){
        refs[k].sort(function(a,b){return a.d-b.d;});
      });

      var results=[];
      strRaw.forEach(function(s,i){
        var tid=String(s.tid||'').trim();
        var meter=parseFloat(s.m);
        var had=s.x!=null&&s.y!=null&&s.z!=null;
        var X=null,Y=null,Z=null,flag='',ver='';
        if(!tid||isNaN(meter)){ flag='no_data'; }
        else{
          var r=refs[tid];
          if(!r||r.length===0){ flag='no_reference'; }
          else{
            var dd=r.map(function(p){return p.d;});
            var ee=r.map(function(p){return p.e;});
            var nn=r.map(function(p){return p.n;});
            var zz=r.map(function(p){return p.z;});
            var exact=-1;
            for(var j=0;j<dd.length;j++){if(Math.abs(dd[j]-meter)<0.05){exact=j;break;}}
            if(exact>=0){
              X=ee[exact];Y=nn[exact];Z=zz[exact];flag='exact';
            }else if(meter<=dd[0]){
              var t=r.length>=2?(meter-dd[0])/(dd[1]-dd[0]):0;
              X=ee[0]+t*(ee[1]-ee[0]);Y=nn[0]+t*(nn[1]-nn[0]);Z=zz[0]+t*(zz[1]-zz[0]);
              flag='extrap_before';
            }else if(meter>=dd[dd.length-1]){
              var n=dd.length;
              var t2=(meter-dd[n-2])/(dd[n-1]-dd[n-2]);
              X=ee[n-2]+t2*(ee[n-1]-ee[n-2]);Y=nn[n-2]+t2*(nn[n-1]-nn[n-2]);Z=zz[n-2]+t2*(zz[n-1]-zz[n-2]);
              flag='extrap_after';
            }else{
              var lo=0;
              for(var k=0;k<dd.length-1;k++){if(meter>=dd[k]&&meter<=dd[k+1]){lo=k;break;}}
              var f=(meter-dd[lo])/(dd[lo+1]-dd[lo]);
              X=ee[lo]+f*(ee[lo+1]-ee[lo]);Y=nn[lo]+f*(nn[lo+1]-nn[lo]);Z=zz[lo]+f*(zz[lo+1]-zz[lo]);
              flag='interpolated';
            }
          }
        }
        if(had&&X!=null){
          var diff=Math.sqrt(Math.pow(s.x-X,2)+Math.pow(s.y-Y,2)+Math.pow(s.z-Z,2));
          ver=diff>5?'⚠ Diff: '+diff.toFixed(1)+'m':'✓ OK (Δ'+diff.toFixed(1)+'m)';
        }else if(X!=null){ ver=flag; }
        var ll=X!=null?utmToLatLng(X,Y,zone):null;
        results.push({
          i:i,tid:tid,m:meter,t:s.t||'',tc:s.tc,sr:s.sr,dp:s.dp,dd:s.dd,
          ox:had?s.x:null,oy:had?s.y:null,oz:had?s.z:null,
          X:X,Y:Y,Z:Z,lat:ll?ll.lat:null,lng:ll?ll.lng:null,
          flag:flag,ver:ver
        });
      });

      var samplePts=[];
      samplesRaw.forEach(function(s){
        if(!s.e||!s.n)return;
        var ll=utmToLatLng(s.e,s.n,zone);
        samplePts.push({
          sid:s.sid,tid:s.tid,df:s.df,dt:s.dt,as:s.as,ar:s.ar,li:s.li,
          e:s.e,n:s.n,z:s.z,lat:ll.lat,lng:ll.lng
        });
      });

      var av=samplePts.map(function(x){return x.as;}).filter(function(x){return x!=null;});
      var aMin=av.length?Math.min.apply(null,av):0;
      var aMax=av.length?Math.max.apply(null,av):1;

      _lastInterpResults = results;
      _lastSamplePts = samplePts;
      renderMap(samplePts,results,aMin,aMax,zone);
    }catch(e){
      document.getElementById('status').innerHTML='<span style="color:#ef5350">Error: '+e.message+'</span>';
      console.error(e);
    }
    document.getElementById('btnInterpolate').disabled=false;
  },50);
}

function renderMap(samplePts,structures,aMin,aMax,zone){
  sampleLayer.clearLayers();
  structureLayer.clearLayers();

  function aCol(v){
    if(v==null||v===undefined)return'#888888';
    if(v<0.10)return'#94a3b8';
    if(v<0.30)return'#1f6fff';
    if(v<0.50)return'#00e57a';
    if(v<1.00)return'#ffd21e';
    if(v<3.00)return'#f5222d';
    return'#e838ff';
  }

  var lats=[],lngs=[];
  samplePts.forEach(function(p){if(p.lat){lats.push(p.lat);lngs.push(p.lng);}});
  structures.forEach(function(s){if(s.lat){lats.push(s.lat);lngs.push(s.lng);}});
  if(lats.length>0){
    var lo=Math.min.apply(null,lats),la=Math.max.apply(null,lats);
    var lnlo=Math.min.apply(null,lngs),lnla=Math.max.apply(null,lngs);
    map.fitBounds([[lo,lnlo],[la,lnla]],{padding:[40,40]});
  }

  samplePts.forEach(function(s){
    if(!s.lat)return;
    var m=L.circleMarker([s.lat,s.lng],{
      radius:4,fillColor:aCol(s.as),color:'rgba(0,0,0,0.5)',weight:0.8,fillOpacity:0.85
    });
    m.bindTooltip('<b>'+s.sid+'</b><br>Trench: '+s.tid+'<br>Depth: '+s.df+'-'+s.dt+'m<br>Assay: '+s.ar+'<br>Litho: '+s.li,
      {direction:'top',offset:[0,-5]});
    sampleLayer.addLayer(m);
  });

  function structSVG(type,color){
    if(type==='FOL'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.6"/><line x1="0" y1="0" x2="0" y2="8" stroke="'+color+'" stroke-width="1.2"/>'; }
    if(type==='BD'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.6"/><circle cx="0" cy="0" r="2" fill="'+color+'"/><line x1="0" y1="2" x2="0" y2="9" stroke="'+color+'" stroke-width="1.2"/>'; }
    if(type==='SHR'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.6"/>'+['-6','-3','0','3','6'].map(function(x,i){return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+(5+i*0.5)+'" stroke="'+color+'" stroke-width="0.9"/>';}).join(''); }
    if(type==='VN'){ return '<line x1="-11" y1="-2" x2="11" y2="-2" stroke="'+color+'" stroke-width="3.5" stroke-linecap="round"/><line x1="-11" y1="2" x2="11" y2="2" stroke="'+color+'" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/><line x1="0" y1="2" x2="0" y2="9" stroke="'+color+'" stroke-width="1.2"/>'; }
    if(type==='DK'){ return '<line x1="-11" y1="-2.5" x2="11" y2="-2.5" stroke="'+color+'" stroke-width="1.5"/><line x1="-11" y1="2.5" x2="11" y2="2.5" stroke="'+color+'" stroke-width="1.5"/><polygon points="-11,-2.5 11,-2.5 11,2.5 -11,2.5" fill="'+color+'" opacity="0.25"/><line x1="0" y1="2.5" x2="0" y2="9" stroke="'+color+'" stroke-width="1.2"/>'; }
    if(type==='CON'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.2" stroke-dasharray="2.5,2.5"/>'+['-7,-5','-3,-2','1,1','5,4'].map(function(p){var xy=p.split(',');return '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="1.2" fill="'+color+'"/>';}).join('')+'<line x1="0" y1="0" x2="0" y2="9" stroke="'+color+'" stroke-width="1.2"/>'; }
    if(type==='FLT'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="2"/>'+['-10','-4','2','8'].map(function(x){return '<polygon points="'+x+',1 '+(+x+2)+',1 '+(+x+2)+',7 '+(+x+1)+',6 '+(+x+1)+',1" fill="'+color+'"/>';}).join(''); }
    if(type==='JT'){ return '<line x1="-11" y1="-1" x2="11" y2="-1" stroke="'+color+'" stroke-width="1.4"/><line x1="-11" y1="1" x2="11" y2="1" stroke="'+color+'" stroke-width="1.4"/><line x1="-3" y1="-1" x2="-3" y2="7" stroke="'+color+'" stroke-width="0.7"/><line x1="0" y1="1" x2="0" y2="8" stroke="'+color+'" stroke-width="0.7"/>'; }
    if(type==='FR'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.4" stroke-dasharray="3,2.5"/><line x1="0" y1="0" x2="0" y2="7" stroke="'+color+'" stroke-width="1" stroke-dasharray="2,2"/>'; }
    if(type==='FD'){ return '<line x1="-11" y1="0" x2="-2" y2="4" stroke="'+color+'" stroke-width="1.2"/><line x1="-2" y1="4" x2="2" y2="-3" stroke="'+color+'" stroke-width="1.2"/><line x1="2" y1="-3" x2="11" y2="0" stroke="'+color+'" stroke-width="1.2"/><polygon points="-9,1.5 -7,-0.5 -9,-1" fill="'+color+'"/><polygon points="9,1.5 7,-0.5 9,-1" fill="'+color+'"/>'; }

    if(type==='FDH'){ return '<line x1="-11" y1="0" x2="11" y2="0" stroke="'+color+'" stroke-width="1.5"/><polygon points="0,1 -3,7 3,7" fill="'+color+'" opacity="0.6" stroke="'+color+'" stroke-width="0.8"/><line x1="0" y1="7" x2="0" y2="11" stroke="'+color+'" stroke-width="1"/>'; }

  }

  var tl={};
  structures.forEach(function(s){
    if(!s.lat)return;
    var col=STR_COLORS[s.t]||STR_FALLBACK;
    var rot=(s.sr!=null)?(s.sr-90):((s.dd!=null)?(s.dd-180):0);
    var svg='<svg width="28" height="28" viewBox="-14 -14 28 28" style="overflow:visible">'+structSVG(s.t,col)+'</svg>';

      html:'<div style="transform:rotate('+rot+'deg);width:28px;height:28px">'+svg+'</div>',

    });
    var label = STR_LABELS[s.t]||s.t||'?';
    var pop='<div style="min-width:200px;line-height:1.5">'+
      '<div style="font-size:13px;font-weight:700;margin-bottom:4px;color:#1a1a2e">'+label+' @ '+s.m+'m</div>'+
      '<table style="width:100%;font-size:11px;border-collapse:collapse">'+
      '<tr><td style="color:#666;padding:1px 4px">Trench</td><td><b>'+s.tid+'</b></td></tr>'+

      '<tr><td style="color:#666;padding:1px 4px">Thickness</td><td>'+(s.tc!=null?s.tc+' cm':'N/A')+'</td></tr>'+
      '<tr><td style="color:#666;padding:1px 4px">Strike/Dip/DD</td><td>'+(s.sr!=null?s.sr+'°':'?')+' / '+(s.dp!=null?s.dp+'°':'?')+' / '+(s.dd!=null?s.dd+'°':'?')+'</td></tr>'+

      '<tr><td style="color:#666;padding:1px 4px">North</td><td>'+(s.Y!=null?s.Y.toFixed(2):'N/A')+'</td></tr>'+
      '<tr><td style="color:#666;padding:1px 4px">Elev</td><td>'+(s.Z!=null?s.Z.toFixed(2):'N/A')+' m</td></tr>'+

    if(!tl[s.t])tl[s.t]=L.layerGroup();
    tl[s.t].addLayer(mk);
    structureLayer.addLayer(mk);
  });

  trenchLabelLayer.clearLayers();
  var trenchMap={};

    if(!s.tid||!s.lat)return;
    var tid=String(s.tid).trim();

    trenchMap[tid].lats.push(s.lat);
    trenchMap[tid].lngs.push(s.lng);

  });

    var t=trenchMap[k];
    if(t.n===0)return;
    var clat=t.lats.reduce(function(a,b){return a+b;},0)/t.lats.length;
    var clng=t.lngs.reduce(function(a,b){return a+b;},0)/t.lngs.length;
    var icon=L.divIcon({

    var mk=L.marker([clat,clng],{icon:icon,interactive:false,keyboard:false});
    mk._tid=t.id; mk._n=t.n;
    trenchLabelLayer.addLayer(mk);
  });
  updateLabelVisibility();

  var ov={'Samples':sampleLayer,'Structures (All)':structureLayer,'Trench Labels':trenchLabelLayer};

        '</svg></span>'+k+' <span style="font-size:10px;color:#8892a4">('+(STR_LABELS[k]||'')+')</span></div>';
    });

    var gcols=['#94a3b8','#1f6fff','#00e57a','#ffd21e','#f5222d','#e838ff'];
    for(var gi=0;gi<grades.length;gi++){
      h+='<div class="legend-item"><span class="legend-dot" style="background:'+gcols[gi]+';border-color:'+gcols[gi]+'"></span>'+grades[gi]+'</div>';
    }
    h+='<hr><h4>Geology (Age)</h4>';
    var geoAge=['Quaternary','Tertiary','Cretaceous','Jurassic','Triassic','Permian','Carboniferous','Devonian','Silurian','Ordovician','Cambrian','Proterozoic','Archean'];
    var geoCol=['#FFFACD','#FFD700','#7FC97F','#4DA6CC','#9666CC','#FF664D','#73ADAD','#CC994D','#B3E6E6','#4DA6CC','#66B366','#FF9999','#FF6666'];
    for(var gi=0;gi<geoAge.length;gi++){
      h+='<div class="legend-item"><span class="legend-dot" style="background:'+geoCol[gi]+';border-color:#888"></span>'+geoAge[gi]+'</div>';
    }
    h+='<hr><div style="font-size:10px;color:#8892a4">UTM Zone '+zone+'N | WGS84</div>';
    d.innerHTML=h;
    return d;
  };
  legendControl.addTo(map);

  var missing=structures.filter(function(s){return s.ox==null;}).length;
  var vok=structures.filter(function(s){return s.ox!=null && s.ver.indexOf('OK')>=0;}).length;
  var vwarn=structures.filter(function(s){return s.ox!=null && s.ver.indexOf('⚠')>=0;}).length;
  var nref=structures.filter(function(s){return s.flag==='no_reference';}).length;

  var trenchIds={};
  samplePts.forEach(function(s){if(s.tid)trenchIds[s.tid]=true;});
  var nTrenches=Object.keys(trenchIds).length;

  document.getElementById('status').innerHTML=

document.getElementById('fileInput').onchange=function(e){
  var file=e.target.files[0];
  if(!file)return;
  document.getElementById('status').innerHTML='<span style="color:#ffb74d">Loading '+file.name+'...</span>';
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:'array'});
      var ss=document.getElementById('sheetSampling');
      var st=document.getElementById('sheetStr');
      ss.innerHTML='';st.innerHTML='';
      wb.SheetNames.forEach(function(n){
        var o1=document.createElement('option');o1.value=n;o1.textContent=n;ss.appendChild(o1);
        var o2=document.createElement('option');o2.value=n;o2.textContent=n;st.appendChild(o2);
      });
      if(wb.SheetNames.indexOf('Sampling')>=0)ss.value='Sampling';
      if(wb.SheetNames.indexOf('Str')>=0)st.value='Str';

      var cs=document.getElementById('colSamplingTid');
      var ct=document.getElementById('colStrTid');
      cs.innerHTML='';ct.innerHTML='';
      var colsS=getColumns(wb,ss.value);
      colsS.forEach(function(c){
        var o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);
      });
      if(colsS.indexOf('Trench_ID')>=0)cs.value='Trench_ID';
      else if(colsS.length>0)cs.value=colsS[0];
      var colsT=getColumns(wb,st.value);
      colsT.forEach(function(c){
        var o=document.createElement('option');o.value=c;o.textContent=c;ct.appendChild(o);
      });
      if(colsT.indexOf('Trench_ID')>=0)ct.value='Trench_ID';
      else if(colsT.length>0)ct.value=colsT[0];

      samplesRaw=parseSheet(wb,ss.value,'sampling',cs.value);
      strRaw=parseSheet(wb,st.value,'str',ct.value);
      document.getElementById('status').innerHTML=
        '<span style="color:#81c784">Loaded:</span> '+samplesRaw.length+' samples, '+strRaw.length+' structures. Ready.';
      document.getElementById('btnInterpolate').disabled=false;
    }catch(err){
      document.getElementById('status').innerHTML='<span style="color:#ef5350">Error: '+err.message+'</span>';
    }
  };
  reader.readAsArrayBuffer(file);
};

function getColumns(wb,sheetName){
  var ws=wb.Sheets[sheetName];
  if(!ws)return[];
  var headers=[];
  var row=XLSX.utils.sheet_to_json(ws,{header:1,range:0})[0]||[];
  row.forEach(function(h){if(h!=null&&h!=='')headers.push(String(h));});
  return headers;
}

document.getElementById('sheetStr').onchange=reparseFromFile;
document.getElementById('colSamplingTid').onchange=reparseFromFile;

function reparseFromFile(){
  var fi=document.getElementById('fileInput');
  if(!fi.files.length)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var wb=XLSX.read(ev.target.result,{type:'array'});
    samplesRaw=parseSheet(wb,document.getElementById('sheetSampling').value,'sampling',document.getElementById('colSamplingTid').value);
    strRaw=parseSheet(wb,document.getElementById('sheetStr').value,'str',document.getElementById('colStrTid').value);
    document.getElementById('status').innerHTML='<span style="color:#81c784">Re-parsed:</span> '+samplesRaw.length+' samples, '+strRaw.length+' structures.';
  };
  reader.readAsArrayBuffer(fi.files[0]);
}

function parseSheet(wb,sheetName,type,tidCol){
  var ws=wb.Sheets[sheetName];
  if(!ws)return[];
  var rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
  if(!tidCol)tidCol='Trench_ID';
  if(type==='sampling'){
    return rows.map(function(r){
      var df=parseFloat(r['Depth_From']), dt=parseFloat(r['Depth_To']);
      var as=parseFloat(String(r['Assay']||'').replace(/[<>]/g,''));
      return{
        tid:String(r[tidCol]||'').trim(),
        sid:String(r['Sample_ID']||'').trim(),
        df:df||0, dt:dt||0, dm:(df+dt)/2,
        e:parseFloat(r['Easting']), n:parseFloat(r['Northing']), z:parseFloat(r['Elevation']),
        as:isNaN(as)?null:as, ar:String(r['Assay']||''),
        li:String(r['Major_Litho']||'')
      };
    });
  }else{
    var pt=null;
    return rows.map(function(r,i){
      var tid=r[tidCol]||pt; pt=tid;
      function sf(v){
        if(v==null||v==='')return null;
        var f=parseFloat(String(v).trim());
        return isNaN(f)?null:f;
      }
      return{
        tid:String(tid||'').trim(), m:sf(r['meter']),
        x:sf(r['X']), y:sf(r['Y']), z:sf(r['Z']),
        t:String(r['Str1_Type']||'').trim(),
        tc:sf(r['Structure_Thick_cm']),
        sr:sf(r['Strike']), dp:sf(r['Dip']), dd:sf(r['Dip_dir'])
      };
    });
  }
}

  }
  var csv = 'Trench_ID,Meter,Str_Type,Computed_X,Computed_Y,Computed_Z,Orig_X,Orig_Y,Orig_Z,Strike,Dip,Dip_Dir,Thickness_cm,Flag,Verification\n';
  _lastInterpResults.forEach(function(s){
    csv += [
      s.tid||'',
      s.m!=null?s.m:'',
      s.t||'',
      s.X!=null?s.X.toFixed(3):'',
      s.Y!=null?s.Y.toFixed(3):'',
      s.Z!=null?s.Z.toFixed(3):'',
      s.ox!=null?s.ox.toFixed(3):'',
      s.oy!=null?s.oy.toFixed(3):'',
      s.oz!=null?s.oz.toFixed(3):'',
      s.sr!=null?s.sr:'',

      s.dd!=null?s.dd:'',
      s.tc!=null?s.tc:'',
      s.flag||'',

  '<script>\n'+
  'var SP = '+spJson+';\n'+
  'var ST = '+stJson+';\n'+

  'var map = L.map("map",{zoomControl:false,zoomSnap:0.5,zoomDelta:0.5}).setView(['+center.lat+','+center.lng+'],'+zoom+');\n'+
  'L.control.zoom({position:"topright"}).addTo(map);\n'+

  // Basemap layers
  'var bl={};\n'+
  'bl.osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:22,maxNativeZoom:19});\n'+
  'bl.geo=L.tileLayer("https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png",{maxZoom:22,maxNativeZoom:14,errorTileUrl:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="});\n'+
  'bl.sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:22,maxNativeZoom:17});\n'+
  'bl.topo=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:22,maxNativeZoom:17});\n'+
  'bl.google_sat=L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",{subdomains:["0","1","2","3"],maxZoom:22,maxNativeZoom:18});\n'+
  'bl.google_hyb=L.tileLayer("https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",{subdomains:["0","1","2","3"],maxZoom:22,maxNativeZoom:18});\n'+
  'bl.bing_aerial=new(L.TileLayer.extend({getTileUrl:function(c){var q="";for(var i=c.z;i>0;i--){var m=1<<(i-1),d=0;if(c.x&m)d+=1;if(c.y&m)d+=2;q+=d;}var s=["t0","t1","t2","t3"][(c.x+c.y)%4];return"https://ecn."+s+".tiles.virtualearth.net/tiles/a"+q+".jpeg?g=1";}}))("",{maxZoom:22,maxNativeZoom:17});\n'+
  'bl.bing_road=new(L.TileLayer.extend({getTileUrl:function(c){var q="";for(var i=c.z;i>0;i--){var m=1<<(i-1),d=0;if(c.x&m)d+=1;if(c.y&m)d+=2;q+=d;}var s=["t0","t1","t2","t3"][(c.x+c.y)%4];return"https://ecn."+s+".tiles.virtualearth.net/tiles/r"+q+".png?g=1";}}))("",{maxZoom:22,maxNativeZoom:17});\n'+
  'bl.geo_sat=L.layerGroup([L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:22,maxNativeZoom:17}),L.tileLayer("https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png",{maxZoom:22,maxNativeZoom:14,opacity:0.5,errorTileUrl:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="})]);\n'+
  'bl.bing_geosat=L.layerGroup([new(L.TileLayer.extend({getTileUrl:function(c){var q="";for(var i=c.z;i>0;i--){var m=1<<(i-1),d=0;if(c.x&m)d+=1;if(c.y&m)d+=2;q+=d;}var s=["t0","t1","t2","t3"][(c.x+c.y)%4];return"https://ecn."+s+".tiles.virtualearth.net/tiles/a"+q+".jpeg?g=1";}}))("",{maxZoom:22,maxNativeZoom:17}),L.tileLayer("https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png",{maxZoom:22,maxNativeZoom:14,opacity:0.5,errorTileUrl:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="})]);\n'+
  'var curBM=bl[BM]||bl.bing_aerial;curBM.addTo(map);\n'+
  'document.getElementById("bmSel").onchange=function(){if(curBM)map.removeLayer(curBM);curBM=bl[this.value]||bl.bing_aerial;curBM.addTo(map);};\n'+

  // Geolocation
  'var _lm=null,_la=null;\n'+
  'document.getElementById("btnLocate").onclick=function(){var b=this;if(b.classList.contains("locating"))return;b.classList.add("locating");b.title="Locating...";map.locate({setView:true,maxZoom:17,timeout:10000,enableHighAccuracy:true});};\n'+
  'map.on("locationfound",function(e){var b=document.getElementById("btnLocate");b.classList.remove("locating");b.title="Find my location";if(_lm)map.removeLayer(_lm);if(_la)map.removeLayer(_la);_la=L.circle(e.latlng,{radius:e.accuracy,color:"#29b6f6",fillColor:"#29b6f6",fillOpacity:0.1,weight:1}).addTo(map);_lm=L.circleMarker(e.latlng,{radius:8,fillColor:"#29b6f6",color:"#fff",weight:2,fillOpacity:0.9}).addTo(map);_lm.bindTooltip("Your location (±"+Math.round(e.accuracy)+"m)",{permanent:true,direction:"top",offset:[0,-10]}).openTooltip();});\n'+
  'map.on("locationerror",function(e){var b=document.getElementById("btnLocate");b.classList.remove("locating");b.title="Find my location (failed)";alert("Could not find location.\\n"+e.message);});\n'+

  // Coordinate Jump
  'function utmToLatLng(ea,no,zn){var a=6378137,f=1/298.257223563,k0=0.9996,b=a*(1-f),e2=1-(b*b)/(a*a),ep2=e2/(1-e2),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2)),x=ea-500000,y=no,M=y/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)),phir=mu+(3*e1/2-27*e1*e1*e1/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1*e1*e1*e1/32)*Math.sin(4*mu)+(151*e1*e1*e1/96)*Math.sin(6*mu),N1=a/Math.sqrt(1-e2*Math.sin(phir)*Math.sin(phir)),T1=Math.tan(phir)*Math.tan(phir),C1=ep2*Math.cos(phir)*Math.cos(phir),R1=a*(1-e2)/Math.pow(1-e2*Math.sin(phir)*Math.sin(phir),1.5),D=x/(N1*k0),lat=phir-(N1*Math.tan(phir)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D*D*D*D/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D*D*D*D*D*D/720);lat=lat*180/Math.PI;var lng0=(zn-1)*6-180+3,lng=(D-(1+2*T1+C1)*D*D*D/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D*D*D*D*D/120)/Math.cos(phir);lng=lng0+lng*180/Math.PI;return{lat:lat,lng:lng};}\n'+
  'var _jm=null;document.getElementById("coordJump").onkeydown=function(e){if(e.key!=="Enter")return;var v=this.value.trim();if(!v)return;var lat=null,lng=null,parts=v.split(/[,\s]+/).map(parseFloat).filter(function(p){return!isNaN(p);});if(parts.length>=2){if(Math.abs(parts[0])<=90&&v.indexOf(",")>=0){lat=parts[0];lng=parts[1];}else if(parts[0]>100000&&parts[1]>1000000){var ll=utmToLatLng(parts[0],parts[1],ZN);lat=ll.lat;lng=ll.lng;}}if(lat===null||lng===null)return;if(_jm)map.removeLayer(_jm);_jm=L.marker([lat,lng],{icon:L.divIcon({html:\'<div style="width:14px;height:14px;background:#ff9800;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,0.5)"></div>\',iconSize:[14,14],iconAnchor:[7,7],className:""})}).addTo(map);_jm.bindTooltip("Jump: "+lat.toFixed(5)+", "+lng.toFixed(5),{permanent:true,direction:"top"}).openTooltip();map.setView([lat,lng],17);};\n'+

  // Assay color
  'function aCol(v){if(v==null||v===undefined)return"#888888";if(v<0.1)return"#94a3b8";if(v<0.3)return"#1f6fff";if(v<0.5)return"#00e57a";if(v<1)return"#ffd21e";if(v<3)return"#f5222d";return"#e838ff";}\n'+

  // Structure SVG

  '  if(t==="FOL")return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.6"/><line x1="0" y1="0" x2="0" y2="8" stroke="\'+c+\'" stroke-width="1.2"/>\';'+

  '  if(t==="SHR"){var s="";for(var i=-6;i<=6;i+=3)s+=\'<line x1="\'+i+\'" y1="0" x2="\'+i+\'" y2="\'+(5+(i+6)/6)+\'" stroke="\'+c+\'" stroke-width="0.9"/>\';return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.6"/>\'+s;}'+

  '  if(t==="DK")return\'<line x1="-11" y1="-2.5" x2="11" y2="-2.5" stroke="\'+c+\'" stroke-width="1.5"/><line x1="-11" y1="2.5" x2="11" y2="2.5" stroke="\'+c+\'" stroke-width="1.5"/><polygon points="-11,-2.5 11,-2.5 11,2.5 -11,2.5" fill="\'+c+\'" opacity="0.25"/><line x1="0" y1="2.5" x2="0" y2="9" stroke="\'+c+\'" stroke-width="1.2"/>\';'+
  '  if(t==="CON")return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.2" stroke-dasharray="2.5,2.5"/><circle cx="-7" cy="-5" r="1.2" fill="\'+c+\'"/><circle cx="-3" cy="-2" r="1.2" fill="\'+c+\'"/><circle cx="1" cy="1" r="1.2" fill="\'+c+\'"/><circle cx="5" cy="4" r="1.2" fill="\'+c+\'"/><line x1="0" y1="0" x2="0" y2="9" stroke="\'+c+\'" stroke-width="1.2"/>\';'+

  '  if(t==="JT")return\'<line x1="-11" y1="-1" x2="11" y2="-1" stroke="\'+c+\'" stroke-width="1.4"/><line x1="-11" y1="1" x2="11" y2="1" stroke="\'+c+\'" stroke-width="1.4"/><line x1="-3" y1="-1" x2="-3" y2="7" stroke="\'+c+\'" stroke-width="0.7"/><line x1="0" y1="1" x2="0" y2="8" stroke="\'+c+\'" stroke-width="0.7"/>\';'+

  '  if(t==="FD")return\'<line x1="-11" y1="0" x2="-2" y2="4" stroke="\'+c+\'" stroke-width="1.2"/><line x1="-2" y1="4" x2="2" y2="-3" stroke="\'+c+\'" stroke-width="1.2"/><line x1="2" y1="-3" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.2"/><polygon points="-9,1.5 -7,-0.5 -9,-1" fill="\'+c+\'"/><polygon points="9,1.5 7,-0.5 9,-1" fill="\'+c+\'"/>\';'+
  '  if(t==="ALZ")return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.8"/><line x1="-11" y1="2" x2="11" y2="2" stroke="\'+c+\'" stroke-width="1" stroke-dasharray="1,2"/><line x1="-11" y1="4" x2="11" y2="4" stroke="\'+c+\'" stroke-width="0.6" stroke-dasharray="1,3"/><line x1="0" y1="0" x2="0" y2="9" stroke="\'+c+\'" stroke-width="1.2"/>\';'+
  '  if(t==="FDH")return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.5"/><polygon points="0,1 -3,7 3,7" fill="\'+c+\'" opacity="0.6" stroke="\'+c+\'" stroke-width="0.8"/><line x1="0" y1="7" x2="0" y2="11" stroke="\'+c+\'" stroke-width="1"/>\';'+
  '  return\'<line x1="-11" y1="0" x2="11" y2="0" stroke="\'+c+\'" stroke-width="1.6"/><line x1="0" y1="0" x2="0" y2="8" stroke="\'+c+\'" stroke-width="1.2"/>\';'+
  '}\n'+

  // Layer groups

  'sl.addTo(map);stl.addTo(map);tll.addTo(map);\n'+

  // Render samples
  'var sampleMarkers=[];\n'+
  'SP.forEach(function(s){if(!s.lat)return;var m=L.circleMarker([s.lat,s.lng],{radius:4.5,fillColor:aCol(s.as),color:"rgba(0,0,0,0.4)",weight:0.8,fillOpacity:0.85});m.bindTooltip("<b>"+s.sid+"</b><br>Trench: "+s.tid+"<br>Depth: "+s.df+"-"+s.dt+"m<br>Assay: "+s.ar+"<br>Litho: "+s.li,{direction:"top",offset:[0,-5]});sl.addLayer(m);sampleMarkers.push(m);});\n'+

  // Render structures
  'var typeGroups={};\n'+
  'ST.forEach(function(s){if(!s.lat)return;var c=SC[s.t]||"#808080";var r=(s.sr!=null)?(s.sr-90):((s.dd!=null)?(s.dd-180):0);var label=SL[s.t]||s.t||"?";var svg=\'<svg width="28" height="28" viewBox="-14 -14 28 28" style="overflow:visible">\'+structSVG(s.t,c)+\'</svg>\';var icon=L.divIcon({html:\'<div style="transform:rotate(\'+r+\'deg);width:28px;height:28px">\'+svg+\'</div>\',iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14],className:""});'+
  '  var pop=\'<div style="min-width:200px">\'+\'<div class="pop-title">\'+label+\' @ \'+s.m+\'m</div>\'+\'<table class="pop-table"><tr><td>Trench</td><td><b>\'+s.tid+\'</b></td></tr><tr><td>Type</td><td>\'+s.t+\'</td></tr><tr><td>Thickness</td><td>\'+(s.tc!=null?s.tc+" cm":"N/A")+\'</td></tr><tr><td>Str/Dip/DD</td><td>\'+(s.sr!=null?s.sr+"°":"?")+\' / \'+(s.dp!=null?s.dp+"°":"?")+\' / \'+(s.dd!=null?s.dd+"°":"?")+\'</td></tr><tr><td>East</td><td>\'+(s.X!=null?s.X.toFixed(2):"N/A")+\'</td></tr><tr><td>North</td><td>\'+(s.Y!=null?s.Y.toFixed(2):"N/A")+\'</td></tr><tr><td>Elev</td><td>\'+(s.Z!=null?s.Z.toFixed(2):"N/A")+\' m</td></tr>\'+(s.ox!=null?\'<tr><td>Original</td><td style="font-size:10px;color:#888">X=\'+s.ox.toFixed(2)+\' Y=\'+s.oy.toFixed(2)+\' Z=\'+s.oz.toFixed(2)+\'</td></tr>\':"")+\'</table>\'+\'<div class="pop-ver" style="color:\'+(s.ver.indexOf("OK")>=0?"#27ae60":(s.ver.indexOf("⚠")>=0?"#e74c3c":"#888"))+\'">\'+(s.ver||"")+\'</div>\'+\'</div>\';'+

  // Trench labels
  'var tc={};SP.forEach(function(s){if(!s.tid||!s.lat)return;var tid=String(s.tid).trim();if(!tc[tid])tc[tid]={lats:[],lngs:[],n:0,id:tid};tc[tid].lats.push(s.lat);tc[tid].lngs.push(s.lng);tc[tid].n++;});\n'+
  'Object.keys(tc).forEach(function(k){var t=tc[k];if(t.n===0)return;var ca=t.lats.reduce(function(a,b){return a+b;},0)/t.lats.length;var co=t.lngs.reduce(function(a,b){return a+b;},0)/t.lngs.length;var icon=L.divIcon({html:\'<div class="trench-label"><span>\'+t.id+\'</span></div>\',iconSize:[0,0],iconAnchor:[0,0],className:""});var mk=L.marker([ca,co],{icon:icon,interactive:false});mk._n=t.n;tll.addLayer(mk);});\n'+

  // Label visibility
  'function updateLabels(){var z=map.getZoom();tll.eachLayer(function(mk){var v=(z>=13);if(v&&z<15&&mk._n<3)v=false;if(mk._icon)mk._icon.style.display=v?"":"none";});}updateLabels();map.on("zoomend",updateLabels);\n'+

  // Layer toggles
  'function toggleLayer(l){var c;if(l==="samples"){c=document.getElementById("chkSamples");c.checked?map.addLayer(sl):map.removeLayer(sl);}else if(l==="structures"){c=document.getElementById("chkStructures");c.checked?map.addLayer(stl):map.removeLayer(stl);}else if(l==="labels"){c=document.getElementById("chkLabels");c.checked?map.addLayer(tll):map.removeLayer(tll);}}\n'+

  // Sidebar toggle

  // Search
  'var _st;document.getElementById("searchBox").oninput=function(){var q=this.value.toLowerCase().trim();clearTimeout(_st);_st=setTimeout(function(){if(!q){sl.eachLayer(function(m){if(m.setStyle)m.setStyle({fillOpacity:0.85});});stl.eachLayer(function(m){if(m._icon){m._icon.style.opacity="1";m._icon.style.filter="none";}});tll.eachLayer(function(m){if(m._icon){m._icon.style.opacity="";m._icon.style.filter="";}});return;}var found=false;sl.eachLayer(function(m){if(!m.setStyle||!m.getTooltip)return;var tt="";try{tt=m.getTooltip().getContent()||"";}catch(e){}var hit=tt.toLowerCase().indexOf(q)>=0;m.setStyle({fillOpacity:hit?0.85:0.06});if(hit&&!found){map.panTo(m.getLatLng());found=true;}});stl.eachLayer(function(m){if(!m._icon||!m.getTooltip)return;var tt="";try{tt=m.getTooltip().getContent()||"";}catch(e){}var hit=tt.toLowerCase().indexOf(q)>=0;m._icon.style.opacity=hit?"1":"0.1";m._icon.style.filter=hit?"none":"grayscale(100%)";if(hit&&!found&&m.getLatLng){map.panTo(m.getLatLng());found=true;}});tll.eachLayer(function(m){if(!m._icon)return;var tid=String(m._tid||"").toLowerCase();m._icon.style.opacity=tid.indexOf(q)>=0?"":"0.12";});},300);};\n'+

  // Coordinate display
  'function utmFromLatLng(lat,lng){var zone=((lng+180)/6)|0;if(zone===0)zone=1;if(zone>60)zone=60;var a=6378137,f=1/298.257223563,k0=0.9996;var r=lat*Math.PI/180,ll=lng*Math.PI/180;var l0=((zone-1)*6-180+3)*Math.PI/180;var e2=2*f-f*f,ep2=e2/(1-e2);var N=a/Math.sqrt(1-e2*Math.sin(r)*Math.sin(r));var T=Math.tan(r)*Math.tan(r);var C=ep2*Math.cos(r)*Math.cos(r);var A=(ll-l0)*Math.cos(r);var M=a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*r-(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*r)+(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*r)-(35*e2*e2*e2/3072)*Math.sin(6*r));var x=k0*N*(A+(1-T+C)*A*A*A/6+(5-18*T+T*T+72*C-58*ep2)*A*A*A*A*A/120)+500000;var y=k0*(M+N*Math.tan(r)*(A*A/2+(5-T+9*C+4*C*C)*A*A*A*A/24+(61-58*T+T*T+600*C-330*ep2)*A*A*A*A*A*A/720));return{x:x.toFixed(0),y:y.toFixed(0),z:zone};}\n'+
  'map.on("mousemove",function(e){var utm=utmFromLatLng(e.latlng.lat,e.latlng.lng);document.getElementById("coordDisplay").innerHTML="WGS84: "+e.latlng.lat.toFixed(6)+", "+e.latlng.lng.toFixed(6)+" | UTM: "+utm.x+"E "+utm.y+"N Zone "+utm.z;});\n'+
